# Runtime stack: the indexer (writes the snapshot) and the API (reads it), sharing one volume.
# Configure via a .env file (see .env.example). Neither service holds a key or moves funds.
#
#   cp .env.example .env   # fill in RPC_URL + deployed addresses + price
#   docker compose up --build
#
# HEALTHCHECKS. Every service writes a heartbeat file into the shared volume on each successful
# work cycle, and healthchecks itself with `ops-check` (docs/RUNTIME.md §8). Each container checks
# only ITS OWN heartbeat on purpose: a whole-stack check inside the indexer would mark the indexer
# unhealthy because the canary died, and Docker would restart the wrong process. Cross-service
# coverage belongs in the cron form, which checks all three at once.
#
# The heartbeats mean "I am doing my job", not "my process exists" — the API beats on a successful
# snapshot reload and the canary on a successful sweep — so a wedged process, the exact failure
# `restart: unless-stopped` never notices on its own, goes unhealthy here.
#
# `node` is the only interpreter available: node:24-slim ships neither curl nor wget.
#
# PID 1 IS `node`, NOT `npm`, AND THAT IS LOAD-BEARING. Every `command:` below is the exec-form
# array of exactly what `npm run start:*` runs (see package.json). `command: npm run start:x` makes
# **npm** PID 1, and npm does not forward SIGTERM to its child: `docker compose stop` killed npm,
# node never saw the signal, and every shutdown hook that §8.6 of docs/RUNTIME.md promises
# silently never ran. Measured A/B on this image, same volume, same signal, same grace
# (docs/RESTORE-DRILL.md §10 finding 7): npm as PID 1 -> stop returns in ~1s with only
# `npm error signal SIGTERM` and no shutdown lines at all; node as PID 1 -> `shutdown.begin` ->
# `shutdown.step … ok:true` -> `shutdown.complete`. The `stop_grace_period` values below are only
# real configuration with node here; under npm they were dead config.
#
# The ARRAY form matters too: the string form `command: node packages/…` is run through
# `/bin/sh -c`, which makes **sh** PID 1 and reproduces the same bug with a different process.
#
# No `init: true`. An init buys signal forwarding and zombie reaping; node as PID 1 needs neither.
# All three services install their own SIGTERM/SIGINT handlers (`createShutdown().install()`,
# packages/oplog/src/shutdown.mjs), so PID 1's missing default signal disposition is covered, and
# none of them spawns a child process, so there are no orphans to reap. An init would only insert
# another process between Docker and the one whose shutdown we care about.
services:
  indexer:
    build: .
    command: ["node", "packages/indexer/src/index-runner.mjs"]
    env_file: .env
    environment:
      STATE_PATH: /data/indexer-state.json
      HEARTBEAT_DIR: /data
    volumes:
      - vault-state:/data
    restart: unless-stopped
    # SIGTERM finishes the current batch, snapshots, and exits. A cold-start catch-up can sit in
    # one batch for a while, so give it room past the compose default of 10s.
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "packages/oplog/src/ops-check.mjs", "--dir=/data", "indexer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build: .
    command: ["node", "apps/api/src/serve.mjs"]   # node, not npm — see the PID 1 note above
    env_file: .env
    environment:
      STATE_PATH: /data/indexer-state.json
      HEARTBEAT_DIR: /data
      PORT: 8402   # pin the CONTAINER port; ${PORT} below is the host-side knob only
    ports:
      - "${PORT:-8402}:8402"
    volumes:
      - vault-state:/data
    depends_on:
      - indexer
    restart: unless-stopped
    stop_grace_period: 30s   # SIGTERM stops reloading, then drains in-flight responses
    healthcheck:
      test: ["CMD", "node", "packages/oplog/src/ops-check.mjs", "--dir=/data", "api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Post-launch canary (docs/CANARY.md). Read-only against the chain: no key, no wallet, no
  # transaction — it only reads. It mounts the shared volume because two of its signals compare
  # the indexer's projection against chain state; it reads that snapshot and never writes it.
  # Silent while healthy: one line per signal transition, nothing otherwise. Set PAGE_WEBHOOK_URL /
  # LOG_WEBHOOK_URL in .env to also POST each transition, split by severity tier (or the single
  # ALERT_WEBHOOK_URL fallback for both), and DEADMAN_PING_URL for the off-host dead-man's switch —
  # `restart: unless-stopped` below restarts a CRASHED canary, but only something not on this host
  # notices a dead host. Do NOT leave CANARY_TEST_ALERT_ON_START set in .env: this service restarts
  # automatically and the self-test fires on every one of those restarts (docs/CANARY.md §5.3).
  canary:
    build: .
    command: ["node", "packages/canary/src/canary-runner.mjs"]   # node, not npm — see above
    env_file: .env
    environment:
      STATE_PATH: /data/indexer-state.json        # the indexer snapshot (read-only to this service)
      CANARY_STATE_PATH: /data/canary-state.json  # its OWN transition state — never the indexer's
      HEARTBEAT_DIR: /data
    volumes:
      - vault-state:/data
    depends_on:
      - indexer
    restart: unless-stopped
    stop_grace_period: 60s   # SIGTERM finishes the in-flight sweep, then flushes transitions
    healthcheck:
      test: ["CMD", "node", "packages/oplog/src/ops-check.mjs", "--dir=/data", "canary"]
      interval: 60s          # a sweep is heavier and slower than an indexer poll
      timeout: 15s
      retries: 3
      start_period: 90s      # the first sweep reads every vault on the chain

volumes:
  vault-state:
