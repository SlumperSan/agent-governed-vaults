name: CI

on:
  push:
    branches: [protocol/main, main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: forge fmt --check
      - run: forge build
      # Unseeded on purpose: every run draws a fresh fuzz/invariant corpus, so CI
      # keeps hunting for new counterexamples rather than replaying one fixture.
      - run: forge test -vvv
      # Fuzz tests are excluded from the gas gate, not from the suite above.
      # Their snapshot value is a mean over a random corpus, and the corpus is
      # not reproducible: it shifts by ~0.01% between machines and between runs
      # on one machine, and pinning --fuzz-seed does not fix it (a `forge clean`
      # alone moves the numbers). Gating on that measures noise, so the gate
      # covers the 124 deterministic tests. Regenerate with:
      #   cd contracts && forge snapshot --nmt "testFuzz"
      # Do not reach for `--tolerance`: it silences the fuzz entries but then
      # falsely flags all 15 invariant entries, which record runs/calls/reverts
      # rather than a gas number.
      - name: Gas snapshot (no regressions)
        run: forge snapshot --check --nmt "testFuzz"
      # Stays last. It used to fail here on VaultFactory vs the EIP-170 cap (issue
      # #10) — a real undeployability defect, kept red on purpose rather than
      # suppressed. Ordering it last meant the suite and the gas gate still ran.
      # Green since Sprint 7 moved VaultCore's creation code into VaultDeployer.
      # Never add `code_size_limit` to foundry.toml or drop `--sizes` to keep it
      # green: that would turn undeployability back into a passing check.
      - name: Runtime size limit (EIP-170)
        run: forge build --sizes

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: cd contracts && forge build
      - name: Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          # Anchored on purpose (Sprint 10, F-3). The old pattern was
          # "lib|test|script" — an unanchored regex, so it also matched
          # src/lib/, and SafeTransferLib, BoundedCall and Checkpoints were
          # silently excluded from every Slither run this project ever did.
          # ~150 LoC of Medium-risk primitives carrying the H-1 and H-2 fixes.
          # Only Foundry's dependency dir (contracts/lib/), test/ and script/
          # are meant to be filtered. Keep the anchors.
          slither-args: --filter-paths "^lib/|^test/|^script/"
        continue-on-error: true  # advisory until the audit-prep triage in the runbook

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # Without this the viem-backed tests skip themselves and the suite silently
      # reports 80/81 forever. Install first so the full 81 actually run.
      - run: npm ci
      # ops-check is a cron job and a compose healthcheck, so its exit CODE is the contract.
      # Assert it with no heartbeats present: it must fail (1), not crash (2) and not pass.
      - name: ops-check fails on absent heartbeats
        run: |
          set +e
          node packages/oplog/src/ops-check.mjs --dir=./no-such-dir
          code=$?
          set -e
          test "$code" = "1" || { echo "expected exit 1, got $code"; exit 1; }
      # abis.test.mjs cross-checks the indexer's embedded event fragments against
      # compiled artifacts, and skips itself when contracts/out is absent — so the
      # drift guard only bites if this job has built the contracts.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: cd contracts && forge build
      - name: Backend + frontend logic tests
        run: npm run test:backend
      # Entrypoints and operational runners have no unit tests — they are exercised
      # by hand against a live chain. Parse them so a syntax error can't reach a
      # 6-hour smoke run or a production boot.
      - name: Syntax-check entrypoints and operational scripts
        run: node --check scripts/smoke-test.mjs && node --check apps/api/src/serve.mjs && node --check packages/indexer/src/index-runner.mjs && node --check packages/canary/src/canary-runner.mjs && node --check packages/oplog/src/ops-check.mjs
