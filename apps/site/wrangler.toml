# Cloudflare Pages configuration for rwally.com.
#
# WHERE THIS FILE HAS TO LIVE, AND WHY IT IS NOT AT THE REPOSITORY ROOT.
# Pages bundles Functions from `./functions` RELATIVE TO THE DIRECTORY WRANGLER RUNS IN — not from
# inside the uploaded asset directory. The first publish of this site (2026-09-05) learned that the
# hard way. Wrangler is run from `apps/site`, so `./functions` is `apps/site/functions` and this
# file sits beside it. `apps/site/README.md` states the same rule from the other side:
# `_headers` and `_redirects` go in `public/` because Pages reads those from the SERVED directory
# (the build output), while `functions/` goes at the PROJECT root because Pages reads it from the
# project rather than the output. Moving it to the repository root would make
# `./functions` resolve to a directory that does not exist and the site would deploy with NO
# Functions at all — which fails silently: the static assets still publish and the hostname
# canonicalization in `functions/_middleware.js` stops running.
#
# `functions/_middleware.js` is the only Function here, and it is not cosmetic: it redirects every
# non-canonical hostname, INCLUDING the *.rwally.pages.dev hostnames, back to the apex. The
# sanctions geofence is a WAF rule on the rwally.com ZONE, and the pages.dev hostnames are not in
# that zone, so without this they are an unfiltered path to the same content. Read that file before
# changing anything here.
#
# `compatibility_flags` is kept only in case a future Function needs it. The one Function present
# uses no Node built-in, so check before relying on it.

name = "rwally"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]
