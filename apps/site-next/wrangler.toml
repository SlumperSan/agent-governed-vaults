# Cloudflare Pages configuration for rwally.com.
#
# WHERE THIS FILE HAS TO LIVE, AND WHY IT IS NOT AT THE REPOSITORY ROOT.
# Pages bundles Functions from `./functions` RELATIVE TO THE DIRECTORY WRANGLER RUNS IN — not from
# inside the uploaded asset directory. The first publish of this site (2026-09-05) learned that the
# hard way. Wrangler is run from `apps/site-next`, so `./functions` is `apps/site-next/functions` and this
# file sits beside it. `apps/site-next/README.md` states the same rule from the other side:
# `_headers` and `_redirects` go in `public/` because Pages reads those from the SERVED directory
# (the build output), while `functions/` goes at the PROJECT root because Pages reads it from the
# project rather than the output. Moving it to the repository root would make
# `./functions` resolve to a directory that does not exist and the site would deploy with NO
# Functions at all — which fails silently: the static assets still publish and the hostname
# canonicalization in `functions/_middleware.js` stops running.
#
# (2026-09-15: this file previously also carried the rationale for `nodejs_compat` and for
# requiring wrangler 4+ — both were about the paid `functions/api/vaults.js` route and its
# `.well-known/x402.js` discovery document, which imported `apps/api/src/x402.mjs`/`facilitator.mjs`
# via Node's `node:crypto`/`Buffer`, and imported a JSON module with an import attribute wrangler 3's
# esbuild could not parse. That route settled payment on Base mainnet (8453), conflicted with the
# Robinhood-Chain-only direction, and duplicated `apps/api`, the one canonical paid API — see the
# owner decision recorded in `docs/REVENUE.md` and PR #294. It was removed along with those two
# Functions. `functions/_middleware.js`, the only Function still in this directory, uses no Node
# built-in and needs no import attribute, so neither rationale applies to what remains here. The
# flags below are left in place only if a future Function needs them again — check before relying
# on either.)

name = "rwally"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-13"
compatibility_flags = ["nodejs_compat"]
