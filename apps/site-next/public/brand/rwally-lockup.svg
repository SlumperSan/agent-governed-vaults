<!-- Rwally, the horizontal lockup. One trace of the owner-picked comic artwork, copied from
     Rwally Brand/logo/final/rwally-lockup-onecolor.svg (brand tokens.json 3.0.0, logo.onecolor-lockup)
     with its currentColor substituted for the ink token #eaeaf3.

     WHY SUBSTITUTED RATHER THAN INHERITED. This file is loaded through an img element, and an SVG
     loaded that way is an isolated document: currentColor there resolves to the document's own
     initial colour, which is black, not to the colour of the page around it. The site has one
     ground and one ink and no theme switch, so one value is the whole answer. Inlining the markup
     instead would let it inherit, and would also put 16 KB into the head of all nine pages.

     Two hyphens in a row are not legal inside an XML comment, so this file avoids them as
     punctuation. An SVG that fails to parse renders as nothing at all. -->
