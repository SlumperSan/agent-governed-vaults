<!-- Rwally, the mark. The ledger R, chosen by the owner on 2026-09-05 and kept by the brand pass
     later that day as the mark to use at favicon and small avatar sizes, where the comic lockup
     collapses. Byte-identical to the path in Rwally Brand/assets/favicon/favicon.svg.

     A capital R drawn as one unbroken stroke: up the stem, round the bowl, in to the throat, then
     out along a leg that steps once and drops square onto the baseline in the same column as the
     bowl's right side. Cap line y=44, baseline y=228, ledger rule y=122. It is stroke geometry, so
     a change of weight is a change of one number.

     MONOCHROME, AND IT INHERITS. Set the CSS color property on an ancestor, or override stroke on
     the svg element. On this brand that is #eaeaf3 on the #07070b ground and #14121f on a light
     one. Do not fill it and do not put it on a tile.

     Clear space 28 units on every side, which is the padding already inside this viewBox. Minimum
     size 16px.

     THIS FILE IS THE STANDALONE ARTWORK AND IS NOT WHAT THE SITE DRAWS. The pages draw
     src/brand/Mark.tsx, which reads the same path out of src/brand/markPath.ts, because an SVG loaded
     through an img element is an isolated document and cannot inherit currentColor. The favicon is
     a third copy, and has to hardcode its colours for the same reason. The test named "the brand
     mark is one path, drawn the same in all three files" in test/site.test.mjs reds when any two of
     the three disagree.

     Two hyphens in a row are not legal inside an XML comment, so this file avoids them as
     punctuation. An SVG that fails to parse renders as nothing at all. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img"
     aria-labelledby="rwally-mark-title"
     fill="none" stroke="currentColor" stroke-width="33"
     stroke-linecap="butt" stroke-linejoin="miter">
  <title id="rwally-mark-title">Rwally</title>
  <path d="M76 228V44H179V122H139L179 190V228"/>
</svg>
