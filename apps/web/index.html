<meta charset="utf-8">
<title>Vault Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* ─────────────────────────────────────────────────────────────────────────────
     TOKENS. No `design/system-foundation` branch exists at the time of writing, so
     this is the minimum needed, kept as flat custom properties in one block so a
     shared system can replace it wholesale without touching a rule below.
     Contrast: every ink-on-surface pair used for text is ≥ 4.5:1 in both themes
     (--faint was lightened from the previous #8a8a9e, which was 3.6:1 on --surface).
     ───────────────────────────────────────────────────────────────────────────── */
  :root {
    --ground:#f2f2f7; --surface:#fff; --surface-2:#eaeaf1; --line:#c9c9d8; --line-soft:#e2e2ec;
    --ink:#17171f; --muted:#4e4e60; --faint:#63637a; --accent:#4b3dd4; --accent-soft:#ece9fd; --accent-ink:#fff;
    --good:#116b3b; --good-soft:#e2f1e9; --warn:#7d4f04; --warn-soft:#f8efd9;
    --crit:#a92b2b; --crit-soft:#f9e3e3; --crit-ink:#fff; --frozen:#125f73; --frozen-soft:#dcf0f4;
    --shadow-1:0 1px 2px rgba(24,24,40,.05),0 1px 3px rgba(24,24,40,.04);
    --shadow-2:0 4px 16px rgba(24,24,40,.10),0 1px 3px rgba(24,24,40,.06);
    --display:'Newsreader','Source Serif 4',Georgia,serif;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --maxw:1180px;
    --tap:24px; /* WCAG 2.2 · 2.5.8 minimum target */
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0e0e16; --surface:#17171f; --surface-2:#20202c; --line:#39394b; --line-soft:#262633;
    --ink:#eaeaf3; --muted:#a8a8bd; --faint:#9090a6; --accent:#a094ff; --accent-soft:#211d3a; --accent-ink:#14121f;
    --good:#5fd89a; --good-soft:#123020; --warn:#f2c14e; --warn-soft:#312608;
    --crit:#ff8b83; --crit-soft:#331a17; --crit-ink:#210b09; --frozen:#6fd4e8; --frozen-soft:#0f2f39;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 24px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --ground:#0e0e16; --surface:#17171f; --surface-2:#20202c; --line:#39394b; --line-soft:#262633;
    --ink:#eaeaf3; --muted:#a8a8bd; --faint:#9090a6; --accent:#a094ff; --accent-soft:#211d3a; --accent-ink:#14121f;
    --good:#5fd89a; --good-soft:#123020; --warn:#f2c14e; --warn-soft:#312608;
    --crit:#ff8b83; --crit-soft:#331a17; --crit-ink:#210b09; --frozen:#6fd4e8; --frozen-soft:#0f2f39;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 6px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:18px 20px 96px}
  h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
  p{margin:0 0 10px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .label{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);margin:0}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .skip{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:var(--r-sm);z-index:100}
  .skip:focus{left:20px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* header */
  header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
  .brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:4px 6px;cursor:pointer;color:inherit;font:inherit;border-radius:var(--r-sm)}
  .brand .mk{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:-.02em}
  .brand .tag{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
  nav.navbtns{display:flex;gap:4px;align-items:center}
  .navlink{font:inherit;font-size:13.5px;color:var(--muted);background:none;border:0;padding:7px 12px;min-height:var(--tap);border-radius:var(--r-sm);cursor:pointer}
  .navlink:hover{color:var(--ink);background:var(--surface-2)}
  .navlink[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:600}
  .hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button.ico{background:var(--surface);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:12px;border-radius:999px;padding:6px 12px;min-height:var(--tap);cursor:pointer}
  button.ico:hover{border-color:var(--accent);color:var(--accent)}

  /* the data-age chip: staleness is a first-class, always-visible fact */
  .agechip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;min-height:var(--tap);color:var(--muted)}
  .agechip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .agechip[data-tone="good"] .dot{background:var(--good)} .agechip[data-tone="good"]{border-color:var(--good)}
  .agechip[data-tone="warn"] .dot{background:var(--warn)} .agechip[data-tone="warn"]{border-color:var(--warn);color:var(--warn)}
  .agechip[data-tone="critical"] .dot{background:var(--crit)} .agechip[data-tone="critical"]{border-color:var(--crit);color:var(--crit)}
  .agechip[data-tone="muted"] .dot{background:var(--faint)}

  /* buttons */
  .btn{font-family:var(--sans);font-size:14px;font-weight:500;min-height:42px;padding:0 18px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn.secondary:hover:not(:disabled){border-color:var(--accent)}
  .btn.ghost{background:transparent;color:var(--muted);border-color:transparent}
  .btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--surface-2)}
  /* --crit-ink, not #fff: white on the dark theme's --crit (#ff8b83) is 2.26:1, and this is the
     ink on "Queue irrevocable exit" and "Permanently skip and deposit". #210b09 is 8.30:1. */
  .btn.danger{background:var(--crit);color:var(--crit-ink);border-color:var(--crit)}
  .btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
  .btn-wrap{display:flex;flex-direction:column;gap:5px;min-width:0}
  .btn-reason{font-size:12.5px;color:var(--muted);max-width:44ch;line-height:1.45}
  .btn-reason[data-sev="blocked"]{color:var(--crit)}
  .btn-reason[data-sev="warn"]{color:var(--warn)}
  .actionbar{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin:18px 0 4px}

  .lede{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.5;color:var(--muted);max-width:62ch;margin:20px 0 6px}
  .seclabel{margin:30px 0 12px;display:flex;align-items:center;gap:10px}
  .seclabel::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .seclabel h2{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);font-weight:500}

  /* notices — every one carries a heading, a glyph and body text; never colour alone */
  .notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);margin:14px 0;font-size:14px;border:1px solid;line-height:1.55}
  .notice .gl{font-family:var(--mono);font-size:15px;line-height:1.4;flex:none}
  .notice .bt{font-weight:600;display:block;margin-bottom:3px}
  .notice[data-tone="frozen"]{background:var(--frozen-soft);border-color:var(--frozen)}
  .notice[data-tone="frozen"] .gl,.notice[data-tone="frozen"] .bt{color:var(--frozen)}
  .notice[data-tone="critical"]{background:var(--crit-soft);border-color:var(--crit)}
  .notice[data-tone="critical"] .gl,.notice[data-tone="critical"] .bt{color:var(--crit)}
  .notice[data-tone="warn"]{background:var(--warn-soft);border-color:var(--warn)}
  .notice[data-tone="warn"] .gl,.notice[data-tone="warn"] .bt{color:var(--warn)}
  .notice[data-tone="info"]{background:var(--accent-soft);border-color:var(--accent)}
  .notice[data-tone="info"] .gl,.notice[data-tone="info"] .bt{color:var(--accent)}
  .notice[data-tone="muted"]{background:var(--surface-2);border-color:var(--line)}

  /* loading / empty / error */
  .state{border:1px dashed var(--line);border-radius:var(--r-md);padding:30px 22px;text-align:center;color:var(--muted);background:var(--surface)}
  .state h3{font-size:17px;color:var(--ink);margin-bottom:5px}
  .state p{max-width:52ch;margin:0 auto 12px}
  .skel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:17px;display:flex;flex-direction:column;gap:11px}
  .sk{background:var(--surface-2);border-radius:5px;height:12px;animation:pulse 1.4s ease-in-out infinite}
  .sk.t{height:19px;width:62%} .sk.n{height:30px;width:48%} .sk.s{width:82%} .sk.xs{width:38%}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  /* vault grid + cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{text-align:left;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:17px;color:inherit;font:inherit;display:flex;flex-direction:column;gap:11px}
  a.card{text-decoration:none;transition:box-shadow .15s,border-color .15s,transform .15s}
  a.card:hover{box-shadow:var(--shadow-2);border-color:var(--accent);transform:translateY(-2px)}
  .card[data-tone="frozen"]{background:var(--frozen-soft);border-color:var(--frozen)}
  .card[data-tone="critical"]{border-color:var(--crit);border-style:dashed}
  .card[data-tone="warn"]{border-color:var(--warn)}
  .card .ttl{font-family:var(--display);font-weight:600;font-size:16.5px;color:var(--ink)}
  .card .addr{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .card .big{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
  .card .unit{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
  .card .meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:500;padding:4px 9px;border-radius:999px;letter-spacing:.03em;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
  .pill[data-tone="good"]{background:var(--good-soft);color:var(--good);border-color:var(--good)}
  .pill[data-tone="warn"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
  .pill[data-tone="critical"]{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
  .pill[data-tone="frozen"]{background:var(--frozen-soft);color:var(--frozen);border-color:var(--frozen)}
  .pill[data-tone="accent"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .meter{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
  .meter>span{display:block;height:100%;background:var(--accent)}
  .meter[data-tone="warn"]>span{background:var(--warn)}
  .meter[data-tone="critical"]>span{background:var(--crit)}

  /* toolbar */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 4px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  .fld input,.fld select{font:inherit;font-size:14px;padding:9px 11px;min-height:42px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
  .fld input[inputmode="decimal"]{font-family:var(--mono);font-size:16px}
  .fld .hint{font-size:12px;color:var(--muted)}
  .fld .err{font-size:12.5px;color:var(--crit);font-weight:500}

  /* detail */
  .detail{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:24px;margin-top:6px}
  .detail[data-tone="frozen"]{background:var(--frozen-soft);border-color:var(--frozen)}
  .backlink{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:7px 8px;min-height:var(--tap);display:inline-flex;gap:6px;margin-bottom:10px;border-radius:var(--r-sm)}
  .backlink:hover{color:var(--accent);background:var(--surface-2)}
  .dhead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .dhead h1{font-size:26px}
  .dhead .addr{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:4px;word-break:break-all}
  .headline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:16px 0 2px}
  .headline .big{font-family:var(--mono);font-size:31px;font-weight:500;font-variant-numeric:tabular-nums}
  .headline .unknown{font-family:var(--mono);font-size:23px;color:var(--frozen)}
  .subline{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:6px}
  .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;margin-top:22px}
  @media (max-width:820px){.cols{grid-template-columns:1fr}}
  .statrow{display:flex;flex-wrap:wrap;gap:22px 30px;margin:18px 0}
  .stat .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  .stat .v{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11px;color:var(--faint);letter-spacing:.05em}

  /* key/value list */
  dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px}
  dl.kv dt{color:var(--muted)}
  dl.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

  /* panels */
  .panel{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
  .panel .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 13px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
  .panel .row:last-child{border-bottom:none}
  .panel .row.total{background:var(--surface-2);font-weight:600}
  .panel .row small{display:block;font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px;max-width:40ch}
  .panel .row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* basket + oracle feeds */
  .basket{display:flex;flex-direction:column;gap:9px}
  .bk{display:grid;grid-template-columns:78px 1fr 92px;align-items:center;gap:10px;font-size:12.5px}
  .bk .bar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-soft)}
  .bk .bar>span{display:block;height:100%;background:var(--accent)}
  .bk .amt{font-family:var(--mono);text-align:right;color:var(--muted);font-size:11.5px}
  .feeds{display:flex;flex-direction:column;gap:0}
  .feed{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13px}
  .feed:first-child{border-top:none}
  .feed .st{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid}
  .feed .st[data-s="fresh"]{color:var(--good);border-color:var(--good);background:var(--good-soft)}
  .feed .st[data-s="ageing"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
  .feed .st[data-s="stale"]{color:var(--crit);border-color:var(--crit);background:var(--crit-soft)}
  .feed .st[data-s="unknown"]{color:var(--muted);border-color:var(--line)}
  .feed .st[data-s="unheld"]{color:var(--faint);border-color:var(--line-soft)}

  /* timeline */
  ol.timeline{list-style:none;margin:14px 0 0;padding:0}
  .ph{display:grid;grid-template-columns:20px 1fr;gap:12px}
  .ph .tk{display:flex;flex-direction:column;align-items:center}
  .ph .node{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);margin-top:4px;flex:none}
  .ph[data-s="done"] .node{background:var(--accent);border-color:var(--accent)}
  .ph[data-s="active"] .node{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .ph .stem{width:2px;flex:1;background:var(--line);margin:2px 0;min-height:14px}
  .ph[data-s="done"] .stem{background:var(--accent)}
  .ph:last-child .stem{display:none}
  .ph .bd{padding-bottom:16px}
  .ph .bd .t{font-weight:600;font-size:13.5px}
  .ph[data-s="active"] .bd .t{color:var(--accent)}
  .ph .bd .d{font-size:12.5px;color:var(--muted);max-width:46ch}

  /* countdown */
  .cd{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
  .cd[data-urgency="soon"]{color:var(--warn)}
  .cd[data-urgency="now"]{color:var(--crit)}

  /* tables */
  .tscroll{overflow-x:auto;border-radius:var(--r-sm)}
  table.lb{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
  table.lb caption{text-align:left;font-size:12.5px;color:var(--muted);padding-bottom:9px;max-width:70ch}
  table.lb th,table.lb td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
  table.lb th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:500}
  table.lb th[scope="row"]{text-align:left;font-family:var(--sans);font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
  table.lb thead th:first-child{text-align:left}
  table.lb td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .sgn{font-family:var(--mono)}
  .sgn[data-s="pos"]{color:var(--good)} .sgn[data-s="neg"]{color:var(--crit)}

  /* dialog */
  .scrim{position:fixed;inset:0;background:rgba(10,10,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);max-width:560px;width:100%;padding:24px;margin:auto}
  @media (max-width:640px){.scrim{padding:0;align-items:stretch}.modal{border-radius:0;min-height:100dvh;max-width:none;border:0}}
  .modal h2{font-size:21px;margin-bottom:5px}
  .modal .sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .steps{display:flex;gap:7px;margin-bottom:16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
  .steps span{color:var(--faint)} .steps span[aria-current="step"]{color:var(--accent);font-weight:600}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 0;line-height:1.5}
  .chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
  .receipt{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);font-size:13.5px;padding:12px 20px;border-radius:var(--r-sm);box-shadow:var(--shadow-2);z-index:60;max-width:min(92vw,520px);line-height:1.45}

  .foot{margin-top:44px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:16px;max-width:80ch}
  .foot code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>

<a class="skip" href="#view">Skip to main content</a>
<div class="wrap">
  <header class="top">
    <button class="brand" type="button" id="brandBtn">
      <span class="mk">Vault Atlas</span>
      <span class="tag">agent-governed index vaults</span>
    </button>
    <nav class="navbtns" id="nav" aria-label="Primary"></nav>
    <div class="hdr-right">
      <span class="agechip" id="ageChip" data-tone="good"><span class="dot"></span><span id="ageText">checking…</span></span>
      <button class="ico" id="themeBtn" type="button" aria-label="Cycle colour theme">◐ Theme</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <p class="foot" id="foot"></p>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div class="sr" id="announcer" role="status" aria-live="polite"></div>

<script type="module">
import {
  usdcExact, usdcShort, usdcCompact, wadExact, bpsPct, shortAddress,
  duration, clock, parseUnits, approx, toBig, USDC_SCALAR, scaleToWad, crossedThreshold,
} from './src/format.mjs';
import { previewDeposit } from './src/deposit-preview.mjs';
import { previewExit, exitFeeBps, secondsUntilFeeBps } from './src/exit-preview.mjs';
import { proposalPhase, PHASES, quorumReadout, proposalRight, PROPOSAL_UNKNOWN } from './src/governance.mjs';
import { vaultView, SORTS } from './src/vault-view.mjs';
import { classify, parseSnapshotAge, describeError, loading, empty, ready } from './src/freshness.mjs';
import { VAULTS, LEADERBOARD, WALLET, NOW } from './src/fixtures.mjs';
import { mapVaultRecords, mapLeaderboard, MISSING_IN_LIVE } from './src/live-adapter.mjs';

/* ══════════════════════════════════════════════════════════════════════════════
   APP STATE.  All financial derivation lives in ./src/*.mjs (tested); this file
   is render + event wiring + focus management only.
   ══════════════════════════════════════════════════════════════════════════════ */

const state = {
  mode: 'fixture',              // 'fixture' | 'live'
  vaults: loading(),            // Fetched<vault records>
  leaderboard: loading(),
  wallet: WALLET,               // null in live mode — no wallet is ever connected
  freshness: classify(null),
  apiBase: null,
  missing: [],                  // fields live mode could not fill
  sort: 'capacity',
  query: '',
  /** Set while a non-localhost ?api= origin is waiting on an explicit yes. */
  consent: null,
  apiConfirmed: false,
  /** The vault the open dialog is about. NOT re-derived from location.hash: the exit dialog can
   *  be opened from #/portfolio, where hash.split('/')[2] is undefined and every subsequent
   *  interaction throws before rendering anything. */
  dialogAddr: null,
  /** Fixture clock. `NOW` in fixture mode so states are stable and reproducible. */
  now: () => (state.mode === 'live' ? Math.floor(Date.now() / 1000) : NOW + Math.floor((Date.now() - bootMs) / 1000)),
};
const bootMs = Date.now();

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const go = (hash) => { location.hash = hash; };
const announce = (msg) => { $('#announcer').textContent = msg; };

/* ── shared fragments ──────────────────────────────────────────────────────── */

const noticeHtml = (n) => `<div class="notice" data-tone="${esc(n.tone)}">
  <span class="gl" aria-hidden="true">${glyphFor(n.tone)}</span>
  <div><span class="bt">${esc(n.title)}</span>${esc(n.body)}</div></div>`;

const glyphFor = (tone) => ({ frozen: '❄', critical: '▲', warn: '!', info: 'i', muted: '·' }[tone] ?? '·');

/** `frozen` is a TRI-STATE. `null` is not "not frozen" and must never take the healthy branch. */
const isFrozen = (x) => x.frozen === true;
const freezeUnknown = (x) => x.frozen === null || x.frozen === undefined;
/** A figure derived from NAV is only showable when the vault is PROVABLY unfrozen. */
const navReadable = (x) => x.frozen === false;

/** A token amount in its own decimals, rendered in WAD. Guards decimals > 18 (B17). */
const tokenAmount = (amount, decimals, maxFrac = 6) => {
  const w = scaleToWad(amount, decimals);
  return w === null ? '—' : wadExact(w, { maxFrac });
};

/** Look a vault record up in the ACTIVE dataset. Never the fixtures first — in live mode an
 *  address collision would render fixture numbers over a live vault. */
const recordFor = (addr) =>
  (state.vaults.kind === 'ready' ? state.vaults.data : []).find(
    (v) => String(v.address).toLowerCase() === String(addr ?? '').toLowerCase(),
  ) ?? null;
/** The exit-mode pill. Never a mode that contradicts the state sitting beside it: "Mode I —
 *  settles now" is false while frozen, because nothing settles at all. */
const modePill = (x) =>
  isFrozen(x) ? pill('Exits halted', 'frozen', '❄')
    : x.mode.mode === 'I' ? pill(x.mode.label, 'good', '→')
      : x.mode.mode === 'F' ? pill(x.mode.label, 'warn', '⏳')
        : pill(x.mode.label, 'critical', '?');

/** `freshness.actionable`, consumed. A projection far enough behind the chain that a freeze or a
 *  new proposal may not have reached it is not a basis for an irreversible action, and says so
 *  rather than only tinting a chip in the header. */
function stalenessNotice() {
  if (state.mode !== 'live' || state.freshness.actionable) return '';
  return noticeHtml({
    tone: 'critical',
    title: state.freshness.ageSec === null
      ? 'This projection did not report its own age.'
      : `This projection is ${duration(state.freshness.ageSec)} behind the chain.`,
    body:
      state.freshness.note +
      ' Base produces a block roughly every two seconds, so a freeze, a new proposal, or a ' +
      'capacity change could have landed since. Nothing below is a basis for a transaction until ' +
      'it is re-read.',
  });
}

const viewFor = (addr) => {
  const rec = recordFor(addr);
  return rec ? vaultView(rec, state.wallet, state.now()) : null;
};

const pill = (label, tone, glyph) =>
  `<span class="pill"${tone ? ` data-tone="${esc(tone)}"` : ''}>${glyph ? `<span aria-hidden="true">${esc(glyph)}</span>` : ''}${esc(label)}</span>`;

/** Loading / empty / error, so no surface can quietly have only two of the four. */
function stateBlock(f, { retry } = {}) {
  if (f.kind === 'loading') {
    return `<div class="grid" aria-busy="true" aria-label="Loading vaults">${'<div class="skel"><div class="sk t"></div><div class="sk xs"></div><div class="sk n"></div><div class="sk s"></div><div class="sk"></div></div>'.repeat(3)}</div>`;
  }
  if (f.kind === 'empty') {
    return `<div class="state"><h3>Nothing here</h3><p>${esc(f.message)}</p></div>`;
  }
  if (f.kind === 'error') {
    return `<div class="state" role="alert"><h3>${esc(f.message)}</h3><p>${esc(f.detail ?? '')}</p>
      ${f.retryable && retry ? `<button class="btn secondary" type="button" data-act="${esc(retry)}">Try again</button>` : ''}</div>`;
  }
  return '';
}

/** A live countdown. Ticks visually; announces only at thresholds (never per second). */
function countdown(deadlineSec, { label = '' } = {}) {
  return `<span class="cd" data-deadline="${Number(deadlineSec)}" data-label="${esc(label)}" role="timer" aria-live="off">${clock(deadlineSec - state.now())}</span>`;
}

/* ══════════════════════════════════════════════════════════════════════════════
   FLOW 1 — DISCOVER
   ══════════════════════════════════════════════════════════════════════════════ */

function renderDiscover() {
  if (state.vaults.kind !== 'ready') {
    return `<p class="lede">Pool USDC into member-governed index baskets; you ratify every rebalance by on-chain vote.</p>${stateBlock(state.vaults, { retry: 'reload' })}`;
  }
  const all = state.vaults.data.map((v) => vaultView(v, state.wallet, state.now()));
  const q = state.query.trim().toLowerCase();
  const match = (x) =>
    !q || `${x.vault.name} ${x.vault.address} ${x.vault.operatorName ?? ''}`.toLowerCase().includes(q);

  const attested = all.filter((x) => x.facts.attested && match(x)).sort(SORTS[state.sort].fn);
  const flagged = all.filter((x) => !x.facts.attested && match(x));

  return `
  <p class="lede">Pool USDC into member-governed index baskets; you ratify every rebalance by
    on-chain vote. See what each vault holds, who runs it, what leaving costs, and which of them
    can’t be entered or exited right now — before you commit a dollar.</p>

  ${state.mode === 'live' ? liveBanner() : fixtureBanner()}
  ${stalenessNotice()}

  <div class="seclabel"><h2>Vaults</h2></div>
  <div class="toolbar">
    <div class="fld">
      <label for="q">Search</label>
      <input id="q" type="search" value="${esc(state.query)}" placeholder="Name, address or operator" autocomplete="off">
    </div>
    <div class="fld">
      <label for="sortSel">Sort by</label>
      <select id="sortSel">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}"${k === state.sort ? ' selected' : ''}>${esc(s.label)}</option>`).join('')}</select>
    </div>
  </div>

  ${attested.length
      ? `<div class="grid">${attested.map(vaultCard).join('')}</div>`
      : stateBlock(empty(q ? `No attested vault matches “${state.query}”.` : 'No attested vaults are indexed yet.'))}

  <div class="seclabel"><h2>Unattested — quarantined</h2></div>
  ${noticeHtml({
      tone: 'critical',
      title: 'Anyone can deploy a vault. These are not attested by the canonical registry.',
      body:
        'They report operator #0, so no registered operator stands behind them, they carry no ' +
        'leaderboard history, and any name or track record they display is self-declared. The ' +
        'registry bit is machine-checkable and cannot be spoofed; a name can. Deposits are ' +
        'withheld on these throughout this app.',
    })}
  ${flagged.length ? `<div class="grid">${flagged.map(vaultCard).join('')}</div>` : stateBlock(empty('No unattested vaults indexed.'))}

  ${renderLeaderboard()}`;
}

function vaultCard(x) {
  const v = x.vault;
  const nav = isFrozen(x)
    ? `<div class="big" style="color:var(--frozen)">Unpriced</div>
       <div class="unit">NAV cannot be read while frozen</div>`
    : freezeUnknown(x)
      ? `<div class="big" style="color:var(--warn)">Unverified</div>
         <div class="unit">The freeze state is unreadable, so NAV may not be readable either</div>`
      : v.navWad !== null
        ? `<div class="big">${esc(approx(usdcCompact((toBig(v.navWad) ?? 0n) / USDC_SCALAR)))}</div>
           <div class="unit">Vault NAV · ${esc(usdcShort((toBig(v.navWad) ?? 0n) / USDC_SCALAR))}</div>`
        : `<div class="big" style="color:var(--muted)">Not exposed</div>
           <div class="unit">NAV needs a chain read</div>`;

  const cap = x.capacity;
  const capKnown = cap.capped && cap.usedBps !== null;
  const capTone = !capKnown ? '' : cap.usedBps >= 9500 ? 'critical' : cap.usedBps >= 8000 ? 'warn' : '';

  return `<a class="card" href="#/vault/${esc(v.address)}"${x.status.tone !== 'good' ? ` data-tone="${esc(x.status.tone)}"` : ''}>
    <div>
      <div class="ttl">${esc(v.name)}</div>
      <div class="addr">${esc(shortAddress(v.address))}</div>
    </div>
    <div class="pills">
      ${pill(x.status.label, x.status.tone, x.status.glyph)}
      ${v.depth ? pill(`Sub-vault · level ${v.depth + 1}`, 'accent') : pill('Root vault')}
      ${x.facts.attested ? pill(`Operator #${v.operatorId}`, 'good', '✓') : pill('Operator #0', 'critical', '▲')}
    </div>
    ${nav}
    <div class="meta"><span>${Number(v.holderCount ?? 0)} member${Number(v.holderCount) === 1 ? '' : 's'}</span>
      <span>${esc(v.operatorName ?? 'self-declared')}</span></div>
    ${capKnown
      ? `<div class="meter"${capTone ? ` data-tone="${capTone}"` : ''}><span style="width:${Math.min(100, cap.usedBps / 100)}%"></span></div>
         <div class="meta"><span>Capacity used</span><span class="num">${esc(bpsPct(cap.usedBps))}</span></div>`
      : cap.capped
        // No meter at all: `used` needs live NAV plus everyone's escrow, and a bar drawn from two
        // missing numbers reads as 0% used — a headroom promise made out of nothing.
        ? `<div class="meta"><span>Capacity used</span><span class="num">Unreadable</span></div>`
        : `<div class="meta"><span>Capacity</span><span class="num">Uncapped</span></div>`}
    <div class="meta"><span>Exit fee, max</span><span class="num">${v.exitFeeMaxBps === null ? 'Not exposed' : esc(bpsPct(v.exitFeeMaxBps))}</span></div>
  </a>`;
}

function renderLeaderboard() {
  const head = `<div class="seclabel"><h2>Operator leaderboard</h2></div>`;
  if (state.leaderboard.kind !== 'ready') return head + stateBlock(state.leaderboard, { retry: 'reload' });
  const rows = state.leaderboard.data;
  if (!rows.length) return head + stateBlock(empty('No operators have realised a gain or loss yet.'));

  return `${head}<div class="tscroll"><table class="lb">
    <caption>Every attested vault an operator has ever run is included, wound-down ones too — losses
      sit beside gains at the same weight, and net is gain minus loss. Operators cannot drop a bad
      vault from this table.</caption>
    <thead><tr>
      <th scope="col">Operator</th><th scope="col">Net realised</th><th scope="col">Gains</th>
      <th scope="col">Losses</th><th scope="col">Fees earned</th><th scope="col">Vaults</th>
    </tr></thead><tbody>
    ${rows.map((o, i) => {
      const neg = o.netRaw < 0n;
      return `<tr>
        <th scope="row"><span class="num" style="color:var(--faint)">${i + 1}</span> ${esc(o.name ?? shortAddress(o.operatorAddress))}</th>
        <td class="n"><span class="sgn" data-s="${neg ? 'neg' : 'pos'}">${neg ? '−' : '+'}${esc(usdcShort(neg ? -o.netRaw : o.netRaw))}</span></td>
        <td class="n">${esc(usdcShort(o.gainRaw))}</td>
        <td class="n">${esc(usdcShort(o.lossRaw))}</td>
        <td class="n">${esc(usdcShort(o.feesRaw))}</td>
        <td class="n">${Number(o.vaultCount ?? 0)}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

/* ══════════════════════════════════════════════════════════════════════════════
   FLOW 2 — INSPECT
   ══════════════════════════════════════════════════════════════════════════════ */

function renderVault(addr) {
  if (state.vaults.kind !== 'ready') return stateBlock(state.vaults, { retry: 'reload' });
  const rec = state.vaults.data.find((v) => String(v.address).toLowerCase() === String(addr).toLowerCase());
  if (!rec) {
    return `<button class="backlink" type="button" data-act="discover">← All vaults</button>
      ${stateBlock({ kind: 'error', message: 'That vault is not in this index.', detail: `No record for ${addr}. It may exist on-chain but not be indexed here.`, retryable: false })}`;
  }
  const x = vaultView(rec, state.wallet, state.now());
  const v = x.vault;
  const now = state.now();

  const navBlock = isFrozen(x)
    ? `<span class="unknown">NAV unavailable — frozen</span>`
    : freezeUnknown(x)
      ? `<span class="unknown" style="color:var(--warn)">NAV/share unverified — the freeze state cannot be read</span>`
      : v.navPerShareWad !== null
      ? `<span class="big">${esc(wadExact(v.navPerShareWad, { maxFrac: 6 }))}</span><span class="subline">USDC per share</span>`
      : `<span class="unknown" style="color:var(--muted)">NAV/share not exposed by this API</span>`;

  return `
  <button class="backlink" type="button" data-act="discover">← All vaults</button>
  <div class="detail"${isFrozen(x) ? ' data-tone="frozen"' : ''}>
    <div class="dhead">
      <div>
        <h1>${esc(v.name)}</h1>
        <div class="addr">${esc(v.address)}</div>
        ${v.parent ? `<div class="addr">Child of <a href="#/vault/${esc(v.parent)}">${esc(v.parentName ?? shortAddress(v.parent))}</a></div>` : ''}
        <div class="pills" style="margin-top:10px">
          ${pill(x.status.label, x.status.tone, x.status.glyph)}
          ${modePill(x)}
          ${v.depth ? pill(`Level ${v.depth + 1} of 3`, 'accent') : pill('Root vault')}
          ${x.facts.attested ? pill(`Attested · operator #${v.operatorId}`, 'good', '✓') : pill('Unattested · operator #0', 'critical', '▲')}
        </div>
      </div>
    </div>

    ${stalenessNotice()}
    ${x.actions.notices.map(noticeHtml).join('')}

    <div class="headline">${navBlock}</div>
    ${renderActionBar(x)}
    ${renderPositionStrip(x)}

    <div class="statrow">
      <div class="stat"><div class="k">Vault NAV</div><div class="v">${navReadable(x) && v.navWad !== null ? esc(usdcShort((toBig(v.navWad) ?? 0n) / USDC_SCALAR)) : '—'}</div></div>
      <div class="stat"><div class="k">Members</div><div class="v">${Number(v.holderCount ?? 0)}</div></div>
      <div class="stat"><div class="k">Capacity used</div><div class="v">${x.capacity.usedBps !== null ? esc(bpsPct(x.capacity.usedBps)) : x.capacity.capped ? 'Unreadable' : 'Uncapped'}${x.capacity.capped ? `<small> · cap ${esc(approx(usdcCompact(x.capacity.cap)))}</small>` : ''}</div></div>
      <div class="stat"><div class="k">Escrowed pending</div><div class="v">${v.totalPendingUsdc !== null ? esc(usdcShort(v.totalPendingUsdc)) : '—'}<small> counts against the cap</small></div></div>
      <div class="stat"><div class="k">Idle USDC</div><div class="v">${v.idleUsdc !== null ? esc(usdcShort(v.idleUsdc)) : '—'}</div></div>
    </div>

    <div class="cols">
      <div>
        ${renderGovernance(x, now)}
        ${renderBasket(x)}
      </div>
      <div>
        ${renderOracle(x)}
        ${renderFees(x)}
        ${renderOperator(x)}
        ${renderRisks(x)}
      </div>
    </div>
  </div>`;
}

/**
 * A blocked action. `aria-disabled` rather than `disabled`, because `disabled` removes the button
 * from the tab order, so a keyboard-only user never reaches it and never hears the reason it
 * carries. The click handler refuses `aria-disabled` centrally.
 */
function actionButton(x, act, label, cls, verdict) {
  const rid = `rsn-${act}-${x.vault.address}`;
  return `<div class="btn-wrap">
    <button class="btn ${cls}" type="button" data-act="${esc(act)}" data-addr="${esc(x.vault.address)}"${verdict.available ? '' : ' aria-disabled="true"'}${verdict.reason ? ` aria-describedby="${esc(rid)}"` : ''}>${esc(label)}</button>
    ${verdict.reason ? `<span class="btn-reason" id="${esc(rid)}" data-sev="${esc(verdict.severity)}">${esc(verdict.reason)}</span>` : ''}</div>`;
}

function renderActionBar(x) {
  const a = x.actions;
  const btn = (act, label, cls, verdict) => actionButton(x, act, label, cls, verdict);

  return `<div class="actionbar">
    ${btn('deposit', 'Deposit USDC', 'primary', a.deposit)}
    ${x.facts.isMember || a.exit.reason ? btn('exit', 'Exit this vault', 'secondary', a.exit) : ''}
    ${x.facts.hasQueuedExit ? btn('settle', 'Settle my queued exit', 'secondary', a.settleQueuedExit) : ''}
    ${x.facts.hasPendingDeposit ? btn('cancel', 'Cancel pending deposit', 'secondary', a.cancelPending) : ''}
    ${x.facts.hasPendingDeposit ? btn('activate', 'Activate deposit', 'secondary', a.activate) : ''}
  </div>`;
}

function renderPositionStrip(x) {
  const p = x.position;
  const pend = x.pendingDeposit;
  if (!p && !pend) return '';
  let html = '<div class="seclabel"><h2>Your position</h2></div><div class="panel">';
  if (p && p.shares > 0n) {
    html += `<div class="row"><div>Shares held<small>Non-transferable — exiting is the only way out.</small></div>
      <div class="v">${esc(wadExact(p.shares, { maxFrac: 6 }))}</div></div>
      <div class="row"><div>Value today</div><div class="v">${p.valueUsdc !== null ? esc(usdcExact(p.valueUsdc)) : 'Unknown while frozen'}</div></div>
      <div class="row"><div>Cost basis</div><div class="v">${p.costBasisUsdc !== null ? esc(usdcExact(p.costBasisUsdc)) : '—'}</div></div>
      <div class="row"><div>Exit fee today<small>${esc(duration(p.tenureSec))} of tenure. ${p.isSoleHolder ? 'Waived — you are the only member, and the fee accrues to remaining members.' : 'Paid to the members who stay, never to the operator.'}</small></div>
        <div class="v">${esc(bpsPct(p.feeBpsNow))}</div></div>`;
  }
  if (pend) {
    const secs = Number(pend.availableAt) - state.now();
    html += `<div class="row"><div>Pending deposit<small>Escrowed outside NAV. Zero shares, no vote, cancellable for a full refund — including while the vault is frozen.</small></div>
      <div class="v">${esc(usdcExact(pend.amountUsdc))}<br>${secs > 0 ? countdown(pend.availableAt, { label: 'Deposit activation' }) : '<span class="cd">Ready to activate</span>'}</div></div>`;
  }
  return html + '</div>';
}

function renderGovernance(x, now) {
  const p = x.vault.proposal;
  const head = '<div class="seclabel"><h2>Governance</h2></div>';
  if (p === PROPOSAL_UNKNOWN) {
    return head + noticeHtml({
      tone: 'critical',
      title: 'Whether a proposal is active here is not knowable from this data.',
      body:
        'Governance.Proposed emits (pid, vault, ptype, proposer, actionHash) and no deadlines, ' +
        'and this data source carries no proposal state at all. This is not "no active proposal": ' +
        'a proposal past its commit deadline forward-prices every exit into an irrevocable queue, ' +
        'and that is exactly the case this page cannot rule out.',
    });
  }
  if (!p) {
    return head + noticeHtml({
      tone: 'muted',
      title: 'No active proposal.',
      body: 'Exits settle in the same transaction, at the NAV at that moment. That changes the instant a proposal reaches its commit deadline.',
    });
  }
  const ph = proposalPhase(p, now);
  const q = quorumReadout({
    ptype: p.ptype,
    revealedWeight: p.revealedWeight, forWeight: p.forWeight, snapshotTotal: p.snapshotTotal,
    memberCount: p.memberCount, quorumBps: x.vault.governanceConfig?.quorumBps,
    revealedVoterCount: p.revealedVoterCount,
  });
  return `${head}
  <div style="font-weight:600;margin-bottom:2px">${esc(p.title)}</div>
  <div style="font-size:12.5px;color:var(--muted);margin-bottom:4px">
    Proposal #${Number(p.pid)} · ${esc(p.ptype)} · ${esc(q.text)}</div>
  ${q.met === false
      ? `<div style="font-size:12.5px;color:var(--warn)">Short of quorum. ${q.regime === 'consensus'
        ? 'A RuleChange has no quorum percentage at all — every eligible share must reveal and vote FOR, so a single silent holder defeats it.'
        : q.regime === 'signers'
          ? 'Under five members this needs a member majority carrying quorum stake, or an outright FOR stake majority. Neither is there yet.'
          : 'Standing defaults move the tally but never count toward quorum, so a proposal can look like it is passing and still fail.'}</div>` : ''}
  ${q.met === null
      ? `<div style="font-size:12.5px;color:var(--muted)">Whether this clears quorum cannot be determined from the data here.</div>` : ''}
  ${ph.deadline ? `<div style="margin:10px 0;font-size:13px">${esc(ph.deadlineLabel)} ${countdown(ph.deadline, { label: ph.deadlineLabel })}</div>` : ''}
  <ol class="timeline">${PHASES.map((phase, i) => `
    <li class="ph" data-s="${i < ph.index ? 'done' : i === ph.index ? 'active' : 'todo'}">
      <div class="tk"><div class="node"></div><div class="stem"></div></div>
      <div class="bd"><div class="t">${esc(phase.label)}${i === ph.index ? ' — now' : ''}</div>
        <div class="d">${esc(phase.blurb)}</div></div></li>`).join('')}</ol>
  ${x.mode.mode !== 'I' ? noticeHtml({
      tone: x.mode.mode === 'unknown' ? 'critical' : 'warn',
      title: x.mode.label,
      body: x.mode.detail,
    }) : ''}`;
}

function renderBasket(x) {
  const head = '<div class="seclabel"><h2>Basket</h2></div>';
  const b = x.vault.basket ?? [];
  if (!b.length) return head + stateBlock(empty('Basket composition needs a chain read and is not served by this API.'));

  // Weights computed from balance × price ÷ NAV where every leg is priced; otherwise the vault's
  // declared target weights, labelled as such. Never a computed weight presented as a target.
  const navWad = toBig(x.vault.navWad);
  const priced = b.every((a) => toBig(a.priceWad) !== null) && navWad !== null && navWad > 0n && navReadable(x);
  // A dollar figure sourced from the exact price the breaker exists to reject is worse than no
  // figure: the per-asset value is withheld unless THAT asset's feed is inside its own bound and
  // the vault is provably unfrozen.
  const usable = (i) => navReadable(x) && ['fresh', 'ageing'].includes(x.oracle.assets[i]?.state);
  return `${head}<div class="basket">
    ${b.map((a, i) => {
    const bal = toBig(a.balance) ?? 0n;
    const price = toBig(a.priceWad);
    const rawValWad = price !== null ? (bal * price) / 10n ** BigInt(a.decimals) : null;
    const valWad = usable(i) ? rawValWad : null;
    const wBps = priced && valWad !== null ? Number((valWad * 10_000n) / navWad) : Number(a.weightBps ?? 0);
    return `<div class="bk">
        <span>${esc(a.symbol)}</span>
        <div class="bar"><span style="width:${Math.min(100, wBps / 100)}%"></span></div>
        <span class="amt">${bpsPct(wBps)}</span>
        <span class="sr">${esc(a.symbol)}: ${bpsPct(wBps)} of NAV</span>
      </div>
      <div class="bk" style="grid-template-columns:78px 1fr"><span></span>
        <span class="amt" style="text-align:left">${esc(tokenAmount(bal, a.decimals))} ${esc(a.symbol)}${valWad !== null
      ? ` · ${esc(usdcShort(valWad / USDC_SCALAR))}`
      : rawValWad !== null ? ' · last price is past its staleness bound — not valued' : ' · unpriced'}</span></div>`;
  }).join('')}
    <div style="font-size:12px;color:var(--muted);margin-top:4px">
      ${priced ? 'Weights computed from live balances × oracle prices ÷ NAV.' : 'Weights are the vault’s declared targets — live prices are unavailable, so actual drift cannot be shown.'}
      Idle USDC (${x.vault.idleUsdc !== null ? esc(usdcShort(x.vault.idleUsdc)) : '—'}) is part of NAV and part of every in-kind exit slice.</div>
  </div>`;
}

function renderOracle(x) {
  const o = x.oracle;
  const head = '<div class="seclabel"><h2>The oracle pricing it</h2></div>';
  if (!o.assets.length) return head + stateBlock(empty('Oracle freshness is read from the vault’s oracle directly and is not served by this API.'));
  return `${head}<div class="feeds">
    ${o.assets.map((a) => `<div class="feed">
      <span>${esc(a.symbol)}</span>
      <span style="color:var(--muted);font-size:12px">${a.state === 'unheld'
      ? 'balance is zero, so navWad never prices it'
      : a.ageSec === null ? 'age unknown' : `updated ${esc(duration(a.ageSec))} ago · bound ${esc(duration(a.boundSec))}`}</span>
      <span class="st" data-s="${esc(a.state)}">${a.state === 'stale' ? `stale by ${esc(duration(a.overBySec))}` : a.state === 'unheld' ? 'not held' : esc(a.state)}</span>
    </div>`).join('')}
  </div>
  <p style="font-size:12.5px;color:var(--muted);margin-top:10px">Every asset must be priceable for the
    vault to value itself. One stale feed freezes the whole vault${o.culprits.length ? ` — here, ${esc(o.culprits.join(' and '))}` : ''}.
    That is the design: it is cheaper to stop than to price something wrong.</p>`;
}

function renderFees(x) {
  const f = x.fees;
  const p = x.position;
  const maxBps = f.exitFeeMaxBps;
  const period = f.exitFeeDecayPeriodSec;
  const DAY = 86_400;
  const at = (t) => bpsPct(exitFeeBps({ exitFeeMaxBps: maxBps, exitFeeDecayPeriodSec: period, tenureSec: t }));

  return `<div class="seclabel"><h2>What it costs</h2></div>
  <div class="panel">
    ${(x.vault.exitFeeMaxBpsByLevel ?? []).slice(0, f.levels).map((lvl, i) => `
      <div class="row"><div>Level ${i + 1}${i === 0 ? ' · root' : ''}<small>10% of realised profit above your high-water mark · exit fee up to ${bpsPct(lvl)}</small></div>
        <div class="v">${bpsPct(lvl)}</div></div>`).join('')}
    <div class="row total"><div>Effective across ${f.levels} level${f.levels > 1 ? 's' : ''}
      <small>${f.levels > 1 ? 'Performance fees compound on net-of-fee value, so it is 19% at depth 2 — not 20%. Exit-fee ceilings add.' : 'Single level, nothing stacks.'}</small></div>
      <div class="v">${bpsPct(f.stackedPerfFeeBps)} perf<br>${f.exitFeeMaxBps === null ? 'not exposed' : `${bpsPct(f.stackedExitFeeCapBps)} exit`}</div></div>
  </div>

  <div class="seclabel"><h2>Your exit fee over time</h2></div>
  ${maxBps === null
      // Not exposed is not zero: exitFeeMaxBps and its decay period are immutable VaultCore
      // constructor arguments that no event carries, so a source without them cannot say leaving
      // is free — which is what reading the missing value as 0 said.
      ? noticeHtml({ tone: 'warn', title: 'This vault’s exit fee is not exposed by this data source.', body: 'exitFeeMaxBps and its decay period are immutable constructor arguments and no event carries them. The ceiling is somewhere between nothing and the protocol cap of 1.00%, and this app cannot narrow it further.' })
      : maxBps === 0
        ? noticeHtml({ tone: 'good', title: 'This vault charges no exit fee.', body: 'Leaving costs you gas and nothing else.' })
        : `<div class="panel">
      ${p ? `<div class="row"><div>Today${p.isSoleHolder ? ' — waived, you are the only member' : ` · ${duration(p.tenureSec)} of tenure`}</div><div class="v">${bpsPct(p.feeBpsNow)}</div></div>` : ''}
      <div class="row"><div>A brand-new deposit</div><div class="v">${at(0)}</div></div>
      <div class="row"><div>After 30 days</div><div class="v">${at(30 * DAY)}</div></div>
      <div class="row"><div>After ${duration(period)} — fully decayed</div><div class="v">0.00%</div></div>
      ${p && p.feeBpsNow > 0n ? (() => {
        const s = secondsUntilFeeBps({ exitFeeMaxBps: maxBps, exitFeeDecayPeriodSec: period, tenureSec: p.tenureSec }, 0);
        return s ? `<div class="row total"><div>Wait ${duration(s)} and it costs you nothing</div><div class="v">0.00%</div></div>` : '';
      })() : ''}
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:9px">The fee stays in the vault: it accrues
      to the members who remain, and can never be routed to the operator. <strong>Any deposit resets
      this clock on your entire position</strong> — the vault measures tenure from your last deposit.</p>`}`;
}

function renderOperator(x) {
  const v = x.vault;
  const row = state.leaderboard.kind === 'ready'
    ? state.leaderboard.data.find((o) => o.operatorId === v.operatorId) : null;
  const gc = v.governanceConfig;
  const stake = x.vault.operatorStakeShares ?? null;
  // pastTotalVotingEligibleShares (Governance.sol:288-291), NOT totalShares — it is net of
  // queued-exit and parent stake, and the wider denominator under-reports the operator's standing.
  const eligibleTotal = v.votingEligibleTotalShares ?? null;
  const right = gc && stake !== null && eligibleTotal !== null
    ? proposalRight({ stake, eligibleTotal, proposalThresholdBps: gc.proposalThresholdBps }) : null;

  return `<div class="seclabel"><h2>Operator</h2></div>
  <div class="panel">
    <div class="row"><div>Registry identity<small>${x.facts.attested ? 'Set by a VaultAttested event from the canonical factory. Not spoofable.' : 'None. This vault is not attested.'}</small></div>
      <div class="v">${x.facts.attested ? `#${v.operatorId}` : '#0'}</div></div>
    <div class="row"><div>Display name<small>Self-declared, and therefore not evidence of anything.</small></div>
      <div class="v" style="font-family:var(--sans)">${esc(v.operatorName ?? '—')}</div></div>
    ${row ? `<div class="row"><div>Net realised, all vaults</div><div class="v">${esc(usdcShort(row.netRaw))}</div></div>
      <div class="row"><div>Realised losses<small>Kept on the record permanently — a wound-down vault stays in the total.</small></div><div class="v">${esc(usdcShort(row.lossRaw))}</div></div>` : ''}
    ${right ? `<div class="row"><div>Right to propose<small>An operator diluted below the threshold permanently loses the right to propose anything — including the rule change that would lower it. Dilution is passive: other members deposit and nothing re-checks.</small></div>
      <div class="v">${right.ok ? `${bpsPct(right.bps)} of ${bpsPct(right.thresholdBps)}` : 'Lost'}</div></div>` : ''}
  </div>`;
}

function renderRisks(x) {
  const risks = [
    ['Contracts are immutable.', 'No proxies, no upgrades, no admin key, no recovery. Nobody can reverse a transaction here — not the operator, not the protocol, not us.'],
    ['Shares cannot be transferred or sold.', 'Exiting the vault is the only way out of a position.'],
    ['A stale oracle freezes deposits and exits.', 'It is a safety mechanism, not an outage: it stops anyone entering or leaving at a price the vault cannot verify. There is no emergency withdrawal, deliberately. Capital still in the observation window stays reclaimable.'],
    ['Exits forward-price during a vote.', 'Once a proposal passes its commit deadline, an exit is queued and settles later at a price nobody can show you yet.'],
    ['The performance fee follows you, per operator.', 'A loss you realised under an operator offsets your future fees under that same operator, in any vault. Reputation is portable in both directions.'],
    ['A USDC transfer that fails becomes an escrow credit, not a payment.', 'If USDC will not transfer to your address — a stablecoin issuer blacklist is the case this exists for — a cancelled deposit, an exit’s USDC leg and any basket slice are credited to you inside the vault instead of being sent. Nothing is lost, but nothing arrives in your wallet either: you claim it separately, and only once transfers to you work again.'],
  ];
  if (x.fees.levels > 1) {
    risks.push(['Fees stack through the chain.', `As a level-${x.fees.levels} vault, the effective performance fee is ${bpsPct(x.fees.stackedPerfFeeBps)} and exit-fee ceilings sum to ${bpsPct(x.fees.stackedExitFeeCapBps)}.`]);
  }
  return `<div class="seclabel"><h2>Before you commit</h2></div>
  <div class="panel">${risks.map(([t, d]) => `<div class="row"><div><strong>${esc(t)}</strong><small>${esc(d)}</small></div></div>`).join('')}</div>`;
}

/* ══════════════════════════════════════════════════════════════════════════════
   FLOW 3 — DEPOSIT   (4-hour observation window · pending · cancellable)
   ══════════════════════════════════════════════════════════════════════════════ */

const draft = { amount: '', skip: false, ackFreeze: false, ackWindow: false, typed: '', step: 1 };

function openDeposit(addr) {
  const x = viewFor(addr);
  if (!x || !x.actions.deposit.available) return;
  state.dialogAddr = x.vault.address;
  Object.assign(draft, { amount: '', skip: false, ackFreeze: false, ackWindow: false, typed: '', step: 1 });
  renderDeposit(x);
}

function renderDeposit(x) {
  const v = x.vault;
  const parsed = parseUnits(draft.amount);
  const pos = x.position;
  const pv = previewDeposit({
    amountUsdc: parsed.ok ? parsed.value : 0n,
    minDepositUsdc: v.minDepositUsdc ?? 0n,
    navUsdc: (toBig(v.navWad) ?? 0n) / USDC_SCALAR,
    navWad: v.navWad,
    totalPendingUsdc: v.totalPendingUsdc ?? 0n,
    capacityCapUsdc: v.capacityCapUsdc ?? 0n,
    totalShares: v.totalShares,
    walletUsdc: state.wallet?.usdcBalance,
    // A tri-state on the way in, a boolean on the way out: an unreadable freeze is not proof the
    // deposit will land, and the notices say so — but it is not the contract's StaleOracle either.
    frozen: x.frozen === true,
    windowCleared: x.holding?.windowCleared,
    sharesHeld: pos?.shares ?? 0n,
    hasPendingDeposit: x.facts.hasPendingDeposit,
    tenure: pos ? { exitFeeMaxBps: v.exitFeeMaxBps, exitFeeDecayPeriodSec: v.exitFeeDecayPeriodSec, tenureSec: pos.tenureSec } : null,
  });

  const steps = `<div class="steps">
    <span${draft.step === 1 ? ' aria-current="step"' : ''}>1 · Amount</span><span aria-hidden="true">→</span>
    <span${draft.step === 2 ? ' aria-current="step"' : ''}>2 · What happens</span><span aria-hidden="true">→</span>
    <span${draft.step === 3 ? ' aria-current="step"' : ''}>3 · Confirm</span></div>`;

  let body = '';
  let acts = '';

  if (draft.step === 1) {
    const err = draft.amount && !parsed.ok ? parsed.error : pv.blockers.filter((b) => b.code !== 'ZeroAmount')[0]?.title;
    body = `${steps}
      <div class="fld">
        <label for="amt">Amount to deposit</label>
        <input id="amt" inputmode="decimal" autocomplete="off" value="${esc(draft.amount)}" placeholder="1000.00"
          aria-describedby="amtHint${err ? ' amtErr' : ''}"${err ? ' aria-invalid="true"' : ''}>
        <span class="hint" id="amtHint">USDC, 6 decimal places. Your balance: ${esc(usdcExact(state.wallet?.usdcBalance))}. Vault minimum: ${esc(usdcExact(v.minDepositUsdc))}.</span>
        ${err ? `<span class="err" id="amtErr">${esc(err)}</span>` : ''}
      </div>
      <div class="panel" style="margin-top:14px">
        <div class="row"><div>Capacity headroom<small>Counts live NAV plus every escrowed pending deposit — not NAV alone. The contract checks it the same way.</small></div>
          <div class="v">${pv.capacity.capped ? esc(usdcExact(pv.capacity.headroom)) : 'Uncapped'}</div></div>
        ${pv.blockers.filter((b) => b.detail).map((b) => `<div class="row"><div><strong style="color:var(--crit)">${esc(b.title)}</strong><small>${esc(b.detail)}</small></div></div>`).join('')}
      </div>`;
    acts = `<button class="btn ghost" type="button" data-act="close">Cancel</button>
      <button class="btn primary" type="button" data-act="dep-next"${pv.ok ? '' : ' disabled'}>Continue</button>`;
  }

  if (draft.step === 2) {
    const win = pv.path === 'window';
    body = `${steps}
      <p style="font-size:14px">You are depositing <strong>${esc(usdcExact(parsed.ok ? parsed.value : 0n))}</strong> into ${esc(v.name)}.</p>
      ${win ? `
      <div class="panel">
        <div class="row"><div><strong>Your money is escrowed for 4 hours.</strong>
          <small>It sits outside the vault’s NAV, mints no shares and carries no vote for the whole window.</small></div></div>
        <div class="row"><div><strong>You can cancel the entire time, for a full refund.</strong>
          <small>Cancelling reads no price, so it works even if the vault freezes mid-window. This is the one action a freeze can never take away from you.</small></div></div>
        <div class="row"><div><strong>Your share count is decided in 4 hours, not now.</strong>
          <small>Shares mint at the NAV at activation, so the estimate below can move. That is deliberate — it is what stops anyone minting against a valuation they read four hours earlier.</small></div></div>
        ${pv.pathIsCertain ? '' : `<div class="row"><div><strong>Unless you have already skipped the window here.</strong>
          <small>That opt-in is a flag on the vault, not an event, so this app cannot read it. If you burned it on an earlier deposit, this one mints immediately instead and there is no cancel period.</small></div></div>`}
      </div>
      <div class="panel" style="margin-top:12px">
        <div class="row"><div>Indicative shares<small>An estimate at today’s NAV. Not a promise.</small></div>
          <div class="v">${pv.shares !== null ? esc(approx(wadExact(pv.shares, { maxFrac: 6 }))) : 'Unknown'}</div></div>
      </div>`
      : `<div class="panel">
        <div class="row"><div><strong>Shares mint immediately.</strong>
          <small>You have already cleared the observation window for this vault, so this deposit mints at the NAV of this transaction — no waiting, and no cancel window.</small></div></div>
        <div class="row"><div>Indicative shares<small>Minting is forward-priced here too: your share count is set by the NAV of the block your transaction lands in, against a basket that moves between now and then. This is what today’s NAV would give you — not a promise.</small></div>
          <div class="v">${pv.shares !== null ? esc(approx(wadExact(pv.shares, { maxFrac: 6 }))) : 'Unknown'}</div></div>
      </div>`}

      ${pv.consequences.filter((c) => c.code === 'TenureReset').map((c) => noticeHtml({
        tone: 'warn', title: c.title,
        body: `Your exit fee goes from ${bpsPct(c.fromBps)} back to ${bpsPct(c.toBps)} — on every share you hold, not just the new ones. ${c.detail}`,
      })).join('')}

      ${win ? `<div class="seclabel"><h2>Entry mode</h2></div>
      <label class="chk"><input type="checkbox" id="skipBox"${draft.skip ? ' checked' : ''}>
        <span><strong>Skip the observation window and mint now.</strong> This opt-in is <strong>permanent
        for this vault and cannot be undone</strong> — once per wallet, forever. You give up the 4-hour
        cancel option on this deposit and on every future one here. The window is the default for a
        reason; there is no way back.</span></label>` : ''}

      <div class="seclabel"><h2>Acknowledge</h2></div>
      <label class="chk"><input type="checkbox" id="ackFreeze"${draft.ackFreeze ? ' checked' : ''}>
        <span>I understand that this vault prices each asset from <strong>one Chainlink feed with no
        fallback</strong>, and that if that feed goes past its heartbeat, prices outside its sane band, or
        the Base sequencer is down <em>or inside its post-recovery grace period</em>, <strong>deposits,
        activations and exits all stop</strong> until it
        recovers, that there is <strong>no emergency withdrawal and no admin who can override it</strong>,
        and that my active capital is trapped for the whole of that period — <strong>permanently if the
        feed is retired rather than merely late</strong>, because a vault’s oracle cannot be replaced.</span></label>
      <label class="chk"><input type="checkbox" id="ackWindow"${draft.ackWindow ? ' checked' : ''}>
        <span>I understand these contracts are <strong>immutable</strong> — no upgrades, no recovery — and
        that shares are <strong>non-transferable</strong>, so exiting is the only way out.</span></label>`;
    acts = `<button class="btn ghost" type="button" data-act="dep-back">Back</button>
      <button class="btn primary" type="button" data-act="dep-next"${draft.ackFreeze && draft.ackWindow ? '' : ' disabled'}>Review</button>`;
  }

  if (draft.step === 3) {
    const win = pv.path === 'window' && !draft.skip;
    const needTyped = draft.skip;
    body = `${steps}
      ${needTyped ? noticeHtml({
        tone: 'critical',
        title: 'You are permanently giving up the observation window for this vault.',
        body: 'This cannot be undone by anyone, ever. Every future deposit you make into this vault will also mint immediately, with no cancel period.',
      }) : ''}
      <div class="panel">
        <div class="row"><div>Vault</div><div class="v" style="font-family:var(--sans)">${esc(v.name)}</div></div>
        <div class="row"><div>Amount</div><div class="v">${esc(usdcExact(parsed.ok ? parsed.value : 0n))}</div></div>
        <div class="row"><div>Entry</div><div class="v" style="font-family:var(--sans)">${win ? '4-hour observation window' : 'Immediate mint'}</div></div>
        <div class="row"><div>Shares<small>Indicative on either path — the count is set by the NAV at ${win ? 'activation, four hours from now' : 'the block this lands in'}, not by the NAV on screen.</small></div>
          <div class="v">${pv.shares === null ? 'Unknown' : esc(approx(wadExact(pv.shares, { maxFrac: 6 })) + (win ? ' — set at activation' : ' — set on landing'))}</div></div>
        <div class="row total"><div>Exit fee if you left immediately after</div><div class="v">${bpsPct(exitFeeBps({ exitFeeMaxBps: v.exitFeeMaxBps, exitFeeDecayPeriodSec: v.exitFeeDecayPeriodSec, tenureSec: 0 }))}</div></div>
      </div>
      ${needTyped ? `<div class="fld" style="margin-top:14px">
        <label for="typed">Type <strong>SKIP</strong> to confirm you are giving this up permanently</label>
        <input id="typed" autocomplete="off" value="${esc(draft.typed)}" aria-describedby="typedHint"${draft.typed && draft.typed !== 'SKIP' ? ' aria-invalid="true"' : ''}>
        <span class="hint" id="typedHint">Case-sensitive. This exists to slow you down.</span>
      </div>` : ''}
      ${signNotice()}`;
    acts = `<button class="btn ghost" type="button" data-act="dep-back">Back</button>
      <button class="btn ${needTyped ? 'danger' : 'primary'}" type="button" data-act="dep-submit"${!needTyped || draft.typed === 'SKIP' ? '' : ' disabled'}>
        ${needTyped ? 'Permanently skip and deposit' : win ? 'Deposit into the window' : 'Deposit'}</button>`;
  }

  openDialog({
    title: `Deposit into ${v.name}`,
    sub: 'Settled in USDC by an on-chain transaction. No metered read fee is charged on anything in this flow.',
    body,
    acts,
    step: `Step ${draft.step} of 3 — ${['amount', 'what happens', 'confirm'][draft.step - 1]}${draft.step === 3 && draft.skip ? '. You are permanently giving up the observation window for this vault.' : ''}`,
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   FLOW 4 — EXIT   (in-kind, pro-rata, Mode I / Mode F)
   ══════════════════════════════════════════════════════════════════════════════ */

const exitDraft = { shares: '', all: true, typed: '', step: 1 };

function openExit(addr) {
  const x = viewFor(addr);
  if (!x || !x.actions.exit.available) return;
  state.dialogAddr = x.vault.address;
  Object.assign(exitDraft, { shares: '', all: true, typed: '', step: 1 });
  renderExit(x);
}

function renderExit(x) {
  const v = x.vault;
  const p = x.position;
  const typedShares = exitDraft.all ? null : parseUnits(exitDraft.shares, 18, { unit: 'Share' });
  const burn = exitDraft.all ? p.shares : (typedShares.ok ? typedShares.value : 0n);
  // `burn` unchanged: previewing 1 wei on a garbage entry returns ok:true and leaves Continue
  // armed on a share count nobody chose.
  const pv = previewExit({
    burnShares: burn,
    memberShares: p.shares,
    totalShares: v.totalShares,
    idleUsdc: v.idleUsdc ?? 0n,
    basket: v.basket ?? [],
    costBasisUsdc: p.costBasisUsdc,
    exitFeeMaxBps: v.exitFeeMaxBps,
    exitFeeDecayPeriodSec: v.exitFeeDecayPeriodSec,
    tenureSec: p.tenureSec,
  });
  // The input's own error, surfaced beside it — the same treatment #amt already gets.
  const shrErr = exitDraft.all ? '' : (exitDraft.shares && !typedShares.ok ? typedShares.error : (!pv.ok ? pv.error : ''));
  // The performance fee is a RANGE, so every leg it touches is rendered as one.
  const feeRange = pv.ok && pv.perfFee !== null && pv.perfFee.maxUsdc > 0n;
  const leg = (min, max, fmt) => (min === null || min === max ? fmt(max) : `${fmt(min)} to ${fmt(max)}`);

  const modeF = x.mode.mode === 'F';
  const modeUnknown = x.mode.mode === 'unknown';
  const hard = modeF || modeUnknown;

  let body, acts;
  if (exitDraft.step === 1) {
    body = `
      <div class="panel">
        <div class="row"><div>Shares you hold</div><div class="v">${esc(wadExact(p.shares, { maxFrac: 6 }))}</div></div>
        <div class="row"><div>Redeeming</div><div class="v">${esc(wadExact(burn, { maxFrac: 6 }))}${exitDraft.all ? ' — all' : ''}</div></div>
      </div>
      <label class="chk"><input type="checkbox" id="allBox"${exitDraft.all ? ' checked' : ''}><span>Exit my whole position</span></label>
      ${exitDraft.all ? '' : `<div class="fld"><label for="shr">Shares to redeem</label>
        <input id="shr" inputmode="decimal" autocomplete="off" value="${esc(exitDraft.shares)}"
          aria-describedby="shrHint${shrErr ? ' shrErr' : ''}"${shrErr ? ' aria-invalid="true"' : ''}>
        <span class="hint" id="shrHint">18 decimal places. You hold ${esc(wadExact(p.shares, { maxFrac: 18 }))}.</span>
        ${shrErr ? `<span class="err" id="shrErr">${esc(shrErr)}</span>` : ''}</div>`}

      <div class="seclabel"><h2>What you actually receive</h2></div>
      ${pv.ok ? `<div class="panel">
        <div class="row"><div>USDC<small>Your slice of the vault’s idle stables${feeRange
      ? ', less the performance fee below'
      : pv.perfFee === null
        ? '. The 10% performance fee is withheld from this leg and from every slice below, and could not be bounded from the data here — so these are pre-fee figures, not receipts'
        : ''}.</small></div>
          <div class="v">${esc(leg(pv.usdcPayMin, pv.usdcPay, usdcExact))}</div></div>
        ${pv.slices.map((sl) => `<div class="row"><div>${esc(sl.symbol)}<small>Paid in the token itself, not sold for you — you carry your own execution cost, and nobody remaining is diluted by your exit.</small></div>
          <div class="v">${esc(leg(sl.amountMin, sl.amount, (n) => tokenAmount(n, sl.decimals, 8)))} ${esc(sl.symbol)}${sl.valueWad !== null ? `<br><span style="color:var(--faint);font-size:11px">${esc(usdcShort(sl.valueWad / USDC_SCALAR))} before the fee</span>` : '<br><span style="color:var(--faint);font-size:11px">unpriced</span>'}</div></div>`).join('')}
        <div class="row"><div>Exit fee ${bpsPct(pv.feeBps)}${pv.isSoleHolder ? ' — waived' : ''}
          <small>${pv.isSoleHolder ? 'You are the only member, and the fee accrues to remaining members — there are none.' : `${duration(p.tenureSec)} of tenure. This stays in the vault and raises NAV/share for the members who remain. It never goes to the operator.`}</small></div>
          <div class="v">${pv.feeValueWad !== null ? '−' + esc(usdcShort(pv.feeValueWad / USDC_SCALAR)) : bpsPct(pv.feeBps)}</div></div>
        ${feeRange ? `<div class="row"><div>Performance fee — up to 10% of realised profit
          <small>Withheld <strong>uniformly</strong> from the USDC leg and from every token slice above, which is why both are shown as ranges. The exact figure turns on the losses you have already realised under this operator — they carry forward against your high-water mark, and no projection exposes them. It is nothing if that carry still covers this gain.</small></div>
          <div class="v">−${esc(usdcShort(0n))} to −${esc(usdcShort(pv.perfFee.maxUsdc))}</div></div>` : ''}
        <div class="row total"><div>Total value${pv.valueComplete ? '' : ' — cannot be totalled'}
          <small>${pv.valueComplete
        ? `At current oracle prices, which move. ${feeRange ? 'The range is the performance fee: the low end assumes the full 10% of gain, the high end assumes your carried losses absorb it.' : 'Token amounts are exact at these share counts.'}`
        : 'One or more assets is unpriced, so the token amounts are shown and the total is withheld rather than guessed.'}</small></div>
          <div class="v">${pv.payoutValueWad !== null ? esc(leg(pv.payoutValueMinWad, pv.payoutValueWad, (n) => usdcShort(n / USDC_SCALAR))) : '—'}</div></div>
      </div>
      ${pv.coversFromChildren ? noticeHtml({ tone: 'warn', title: 'Part of this exit unwinds a child vault.', body: 'Idle stables do not cover your slice, so the vault redeems from a child to make up the difference. The amounts above are indicative for that portion, and the exit will revert if the child is mid-rebalance — retry once it settles.' }) : ''}`
      : `<div class="state" role="alert"><h3>${esc(pv.error)}</h3></div>`}
      ${p.feeBpsNow > 0n && !pv.isSoleHolder ? (() => {
        const s = secondsUntilFeeBps({ exitFeeMaxBps: v.exitFeeMaxBps, exitFeeDecayPeriodSec: v.exitFeeDecayPeriodSec, tenureSec: p.tenureSec }, 0);
        return s ? noticeHtml({ tone: 'info', title: `Waiting ${duration(s)} would make this exit free.`, body: `The fee decays to zero at ${duration(v.exitFeeDecayPeriodSec)} of tenure. Depositing again would reset that clock.` }) : '';
      })() : ''}`;
    acts = `<button class="btn ghost" type="button" data-act="close">Cancel</button>
      <button class="btn ${hard ? 'danger' : 'primary'}" type="button" data-act="exit-next"${pv.ok ? '' : ' disabled'}>Continue</button>`;
  } else {
    body = `
      ${modeUnknown ? noticeHtml({ tone: 'critical', title: 'This app cannot tell you which way this exit settles.', body: x.mode.detail }) : ''}
      ${modeF ? noticeHtml({
        tone: 'critical',
        title: 'This exit will be queued, and it cannot be cancelled.',
        body: 'A proposal in this vault is past its commit deadline. Your redemption is queued now and settles later — inside the transaction that executes the proposal, at the NAV at that moment. Nobody can show you that price today. If the proposal expires unexecuted it settles then instead, at whatever NAV applies. You carry the outcome either way.',
      }) + noticeHtml({
        tone: 'critical',
        title: 'Your shares stop voting the moment you queue.',
        body: 'Queued shares are excluded from voting-eligible stake immediately. You cannot vote on, or influence, the proposal you are exiting ahead of.',
      }) + noticeHtml({
        tone: 'info',
        title: 'The alternative, stated plainly.',
        body: 'Wait until the proposal executes or expires, then exit in Mode I at a price you can read before signing. That is usually the better trade unless you specifically want out before the rebalance lands.',
      }) : ''}
      ${!hard ? noticeHtml({
        tone: 'good', title: 'This exit settles now, in one transaction.',
        body: 'No proposal is past its commit deadline, so your shares burn and your in-kind slice transfers immediately at current NAV.',
      }) : ''}
      <div class="panel">
        <div class="row"><div>Vault</div><div class="v" style="font-family:var(--sans)">${esc(v.name)}</div></div>
        <div class="row"><div>Shares redeemed</div><div class="v">${esc(wadExact(burn, { maxFrac: 6 }))}</div></div>
        <div class="row"><div>Exit fee</div><div class="v">${bpsPct(pv.feeBps)}</div></div>
        <div class="row"><div>Settles</div><div class="v" style="font-family:var(--sans)">${modeF ? 'Later — on execution' : modeUnknown ? 'Unresolved' : 'Immediately'}</div></div>
      </div>
      ${hard ? `<div class="fld" style="margin-top:14px">
        <label for="etyped">Type <strong>QUEUE</strong> to confirm you accept an irrevocable exit at an unknown price</label>
        <input id="etyped" autocomplete="off" value="${esc(exitDraft.typed)}" aria-describedby="etypedHint"${exitDraft.typed && exitDraft.typed !== 'QUEUE' ? ' aria-invalid="true"' : ''}>
        <span class="hint" id="etypedHint">Case-sensitive.</span></div>` : ''}
      ${signNotice()}`;
    acts = `<button class="btn ghost" type="button" data-act="exit-back">Back</button>
      <button class="btn ${hard ? 'danger' : 'primary'}" type="button" data-act="exit-submit"${!hard || exitDraft.typed === 'QUEUE' ? '' : ' disabled'}>
        ${modeF ? 'Queue irrevocable exit' : modeUnknown ? 'Continue anyway' : 'Exit now'}</button>`;
  }

  openDialog({
    title: `Exit ${v.name}`,
    sub: `${x.mode.label}. Paid pro-rata in kind — basket tokens plus your share of idle USDC.`,
    body,
    acts,
    step: exitDraft.step === 1
      ? 'Step 1 of 2 — how much to redeem'
      : `Step 2 of 2 — confirm.${modeF ? ' This exit would be queued, cannot be cancelled, and your shares stop voting the moment you queue.' : modeUnknown ? ' This app cannot tell you whether this exit settles now or queues irrevocably.' : ''}`,
  });
}

/** This app never connects a wallet and never signs. Say so where a signature would happen. */
function signNotice() {
  return noticeHtml({
    tone: 'muted',
    title: 'This is a read-only interface.',
    body: 'It never connects a wallet, holds a key, or signs anything. Confirming here shows you the transaction that would be requested — nothing is broadcast.',
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   PORTFOLIO
   ══════════════════════════════════════════════════════════════════════════════ */

function renderPortfolio() {
  if (state.vaults.kind !== 'ready') return stateBlock(state.vaults, { retry: 'reload' });
  if (!state.wallet) {
    return `<p class="lede">Your positions across the protocol.</p>
      ${stateBlock(empty('No wallet is connected. This interface is read-only and never connects one; in live mode there is no per-member projection to read a position from either.'))}`;
  }
  const views = state.vaults.data.map((v) => vaultView(v, state.wallet, state.now()));
  const held = views.filter((x) => x.position && x.position.shares > 0n);
  const pending = views.filter((x) => x.pendingDeposit);

  if (!held.length && !pending.length) {
    return `<p class="lede">Your positions across the protocol.</p>
      ${stateBlock(empty('No positions yet.'))}
      <div style="text-align:center"><a class="btn primary" href="#/discover" style="text-decoration:none">Explore vaults</a></div>`;
  }

  const totalKnown = held.every((x) => x.position.valueUsdc !== null);
  const total = held.reduce((a, x) => a + (x.position.valueUsdc ?? 0n), 0n);
  const unvalued = held.filter((x) => x.position.valueUsdc === null);

  return `<p class="lede">Your positions across the protocol.</p>
  ${stalenessNotice()}
  <div class="headline"><span class="big">${totalKnown ? esc(usdcExact(total)) : esc(approx(usdcExact(total)))}</span></div>
  <div class="subline">${totalKnown
      ? 'Total value at current NAV. Exact, not rounded.'
      : `Partial — ${unvalued.length} vault${unvalued.length === 1 ? '' : 's'} cannot be valued, so ${unvalued.map((x) => esc(x.vault.name)).join(', ')} ${unvalued.length === 1 ? 'is' : 'are'} excluded from this figure rather than carried at a stale price.`}</div>

  ${pending.length ? `<div class="seclabel"><h2>In the observation window</h2></div>
    ${noticeHtml({
      tone: 'info',
      title: 'Waiting is a normal state here, not a problem.',
      body: 'This money is escrowed outside the vault: it holds no shares, earns nothing and carries no vote until it activates. You can cancel it for a full refund at any point — and cancelling is the one action that keeps working even if the vault freezes.',
    })}
    <div class="grid">${pending.map(pendingCard).join('')}</div>` : ''}

  ${held.length ? `<div class="seclabel"><h2>Positions</h2></div>
    <div class="grid">${held.map(positionCard).join('')}</div>` : ''}`;
}

function pendingCard(x) {
  const p = x.pendingDeposit;
  const secs = Number(p.availableAt) - state.now();
  const matured = secs <= 0;
  return `<div class="card">
    <div><div class="ttl">${esc(x.vault.name)}</div><div class="addr">${esc(shortAddress(x.vault.address))}</div></div>
    <div class="pills">${pill('Pending — 0 shares', 'info', '◷')}${isFrozen(x) ? pill('Vault frozen', 'frozen', '❄') : freezeUnknown(x) ? pill('Freeze state unknown', 'warn', '?') : ''}</div>
    <div class="big">${esc(usdcExact(p.amountUsdc))}</div>
    <div class="unit">${matured ? 'Ready to activate' : 'Activates in'} ${matured ? '' : countdown(p.availableAt, { label: `${x.vault.name} deposit activation` })}</div>
    <div class="actionbar" style="margin:4px 0 0">
      ${actionButton(x, 'cancel', 'Cancel · full refund', 'secondary', { available: true, reason: 'Reads no price, so it works during a freeze too.', severity: 'ok' })}
      ${actionButton(x, 'activate', 'Activate', 'primary', x.actions.activate)}
    </div></div>`;
}

function positionCard(x) {
  const p = x.position;
  return `<div class="card"${x.status.tone !== 'good' ? ` data-tone="${esc(x.status.tone)}"` : ''}>
    <div><div class="ttl">${esc(x.vault.name)}</div><div class="addr">${esc(shortAddress(x.vault.address))}</div></div>
