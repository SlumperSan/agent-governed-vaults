    <div class="pills">${pill(x.status.label, x.status.tone, x.status.glyph)}${modePill(x)}</div>
    <div class="big">${p.valueUsdc !== null ? esc(usdcExact(p.valueUsdc)) : 'Unpriced'}</div>
    <div class="unit">${p.valueUsdc !== null
      ? 'Value at current NAV'
      : isFrozen(x) ? 'Frozen — value cannot be read' : 'NAV is not readable here, so this is not valued'}</div>
    <div class="meta"><span class="num">${esc(wadExact(p.shares, { maxFrac: 4 }))} shares</span>
      <span>${esc(duration(p.tenureSec))} tenure</span></div>
    <div class="meta"><span>Exit fee today</span><span class="num">${esc(bpsPct(p.feeBpsNow))}</span></div>
    ${p.pnlUsdc !== null ? `<div class="meta"><span>Against cost basis</span>
      <span class="sgn" data-s="${p.pnlUsdc >= 0n ? 'pos' : 'neg'}">${p.pnlUsdc >= 0n ? '+' : '−'}${esc(usdcShort(p.pnlUsdc >= 0n ? p.pnlUsdc : -p.pnlUsdc))}</span></div>
      <div style="font-size:11.5px;color:var(--faint)">Before the 10% performance fee, which is charged only on realised profit above your high-water mark with this operator.</div>` : ''}
    <div class="actionbar" style="margin:4px 0 0">
      <div class="btn-wrap"><a class="btn secondary" href="#/vault/${esc(x.vault.address)}" style="text-decoration:none">Inspect</a></div>
      ${actionButton(x, 'exit', 'Exit', 'secondary', x.actions.exit)}
      ${x.facts.hasQueuedExit ? actionButton(x, 'settle', 'Settle queued exit', 'secondary', x.actions.settleQueuedExit) : ''}
    </div></div>`;
}

/* ══════════════════════════════════════════════════════════════════════════════
   DIALOG — focus trap, Escape, restore, labelled
   ══════════════════════════════════════════════════════════════════════════════ */

let lastFocused = null;

/**
 * @param {{title:string, sub:string, body:string, acts:string, step?:string}} d
 *   `step` names what this render IS ("Step 2 of 3 — what happens"). A live region that is handed
 *   the identical string on every re-render announces it once and is silent afterwards, which is
 *   how the irrevocability warnings on the Mode-F confirm went unread.
 */
function openDialog({ title, sub, body, acts, step = '' }) {
  const reopening = Boolean($('#modal .modal'));
  if (!reopening) lastFocused = document.activeElement;
  const active = document.activeElement?.id;
  const selStart = document.activeElement?.selectionStart;
  const selEnd = document.activeElement?.selectionEnd;

  $('#modal').innerHTML = `<div class="scrim" data-act="scrim">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgSub" tabindex="-1">
      <h2 id="dlgTitle">${esc(title)}</h2>
      <p class="sub" id="dlgSub">${esc(sub)}${step ? ` · ${esc(step)}` : ''}</p>
      ${body}
      <div class="acts">${acts}</div>
    </div></div>`;

  // aria-modal alone does not stop a screen reader walking the page behind the dialog. `#modal`
  // is outside `.wrap`, so inerting the wrapper covers the header and nav too, not just <main>.
  $('.wrap').setAttribute('inert', '');
  $('.wrap').setAttribute('aria-hidden', 'true');

  // Re-renders happen on every keystroke; keep the caret where the user left it, not at the end —
  // otherwise editing 1000 into 10000 from the front is impossible.
  const restore = active && $(`#${CSS.escape(active)}`);
  if (reopening && restore) {
    restore.focus();
    if (typeof selStart === 'number' && restore.setSelectionRange) {
      try { restore.setSelectionRange(selStart, typeof selEnd === 'number' ? selEnd : selStart); } catch { /* not a text input */ }
    }
    if (step && step !== lastAnnouncedStep) { lastAnnouncedStep = step; announce(step); }
  } else {
    // The dialog itself, not its first input — on the Mode-F confirm the first input sits BELOW
    // two "this cannot be cancelled" notices, and landing on it skips past both.
    $('#modal .modal').focus();
    lastAnnouncedStep = step;
    announce(`${title}. ${step || 'Dialog opened.'}`);
  }
}

let lastAnnouncedStep = '';

function closeDialog() {
  if (!$('#modal').innerHTML) return;
  $('#modal').innerHTML = '';
  $('.wrap').removeAttribute('inert');
  $('.wrap').removeAttribute('aria-hidden');
  state.dialogAddr = null;
  lastAnnouncedStep = '';
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}

const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

document.addEventListener('keydown', (e) => {
  const modal = $('#modal .modal');
  if (!modal) return;
  if (e.key === 'Escape') { e.preventDefault(); closeDialog(); return; }
  if (e.key !== 'Tab') return;
  const items = [...modal.querySelectorAll(FOCUSABLE)].filter((el) => el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!modal.contains(document.activeElement) || document.activeElement === modal) {
    e.preventDefault();
    return (e.shiftKey ? last : first).focus();
  }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

let toastT;
function toast(msg) {
  $('#toast').innerHTML = `<div class="toast">${esc(msg)}</div>`;
  announce(msg);
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('#toast').innerHTML = ''; }, 6000);
}

/* ══════════════════════════════════════════════════════════════════════════════
   EVENTS
   ══════════════════════════════════════════════════════════════════════════════ */

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
  const act = t.dataset.act;
  const addr = t.dataset.addr;
  const curr = () => dialogVault();

  if (act === 'scrim' && e.target === t) return closeDialog();
  if (act === 'close') return closeDialog();
  if (act === 'discover') return go('#/discover');
  if (act === 'reload') return boot();
  if (act === 'api-allow') { state.apiConfirmed = true; return boot(); }
  if (act === 'api-deny') { state.apiConfirmed = false; return bootFixtures(); }
  if (act === 'deposit') return openDeposit(addr);
  if (act === 'exit') return openExit(addr);

  if (act === 'cancel') {
    closeDialog();
    return toast('This is where the cancelPending() transaction would be requested. It reads no price, so it works even while the vault is frozen. Your deposit returns to your wallet — unless USDC will not transfer to you, in which case the vault credits it to you as claimable escrow instead, and you claim it when transfers work again.');
  }
  if (act === 'settle') {
    closeDialog();
    return toast('This is where the settleQueuedExit() transaction would be requested. Nothing calls it for you — a queued exit sits locked and non-voting until somebody does, and anybody can.');
  }
  if (act === 'activate') {
    closeDialog();
    return toast('This is where the activate() transaction would be requested. Shares mint at the NAV of that transaction — the number is only knowable once it lands.');
  }

  if (act === 'dep-next') { draft.step += 1; return renderDeposit(curr()); }
  if (act === 'dep-back') { draft.step -= 1; draft.typed = ''; return renderDeposit(curr()); }
  if (act === 'dep-submit') {
    const skip = draft.skip;
    closeDialog();
    return toast(skip
      ? 'This is where the skipWindow() + deposit transactions would be requested. The opt-in would be permanent for this vault.'
      : 'This is where the deposit() transaction would be requested. Your USDC would sit in escrow for 4 hours, cancellable throughout, then mint at activation NAV.');
  }

  if (act === 'exit-next') { exitDraft.step = 2; return renderExit(curr()); }
  if (act === 'exit-back') { exitDraft.step = 1; exitDraft.typed = ''; return renderExit(curr()); }
  if (act === 'exit-submit') {
    const x = curr();
    closeDialog();
    return toast(x.mode.mode === 'F'
      ? 'This is where the requestExit() transaction would be requested. It would queue irrevocably and settle at the post-execution NAV.'
      : 'This is where the requestExit() transaction would be requested. It would settle in the same transaction, in kind, at current NAV.');
  }
});

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'q') { state.query = e.target.value; return rerenderKeepingFocus(); }
  if (id === 'amt') { draft.amount = e.target.value; return renderDeposit(dialogVault()); }
  if (id === 'typed') { draft.typed = e.target.value; return renderDeposit(dialogVault()); }
  if (id === 'shr') { exitDraft.shares = e.target.value; return renderExit(dialogVault()); }
  if (id === 'etyped') { exitDraft.typed = e.target.value; return renderExit(dialogVault()); }
});

document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'sortSel') { state.sort = e.target.value; return render(); }
  if (id === 'skipBox') { draft.skip = e.target.checked; return renderDeposit(dialogVault()); }
  if (id === 'ackFreeze') { draft.ackFreeze = e.target.checked; return renderDeposit(dialogVault()); }
  if (id === 'ackWindow') { draft.ackWindow = e.target.checked; return renderDeposit(dialogVault()); }
  if (id === 'allBox') { exitDraft.all = e.target.checked; return renderExit(dialogVault()); }
});

/** The vault the OPEN DIALOG is about. The exit dialog is reachable from #/portfolio, where the
 *  hash carries no vault address at all. */
function dialogVault() {
  return viewFor(state.dialogAddr);
}

function rerenderKeepingFocus() {
  const id = document.activeElement?.id;
  const pos = document.activeElement?.selectionStart;
  render();
  const el = id && $(`#${CSS.escape(id)}`);
  if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch { /* not a text input */ } }
}

$('#brandBtn').addEventListener('click', () => go('#/discover'));
$('#themeBtn').addEventListener('click', () => {
  const c = document.documentElement.getAttribute('data-theme');
  const n = c === 'dark' ? 'light' : c === 'light' ? null : 'dark';
  if (n) document.documentElement.setAttribute('data-theme', n);
  else document.documentElement.removeAttribute('data-theme');
  announce(`Theme: ${n ?? 'follows your system setting'}`);
});

/* ══════════════════════════════════════════════════════════════════════════════
   COUNTDOWNS — tick every second, ANNOUNCE only at thresholds
   ══════════════════════════════════════════════════════════════════════════════ */

const announcedAt = new Map();
const THRESHOLDS = [3600, 900, 300, 60, 0]; // 1h, 15m, 5m, 1m, elapsed

setInterval(() => {
  for (const el of document.querySelectorAll('.cd[data-deadline]')) {
    const left = Number(el.dataset.deadline) - state.now();
    el.textContent = left > 0 ? clock(left) : 'now';
    el.dataset.urgency = left <= 300 ? 'now' : left <= 3600 ? 'soon' : 'later';

    // WCAG 4.1.3: announce at meaningful thresholds only. Announcing every second would flood a
    // screen reader with noise and bury the one reading that matters.
    const key = el.dataset.deadline;
    const crossed = crossedThreshold(left, THRESHOLDS);
    if (crossed !== null && announcedAt.get(key) !== crossed) {
      announcedAt.set(key, crossed);
      const label = el.dataset.label || 'Countdown';
      announce(left > 0 ? `${label}: ${duration(left)} remaining.` : `${label}: the deadline has passed.`);
    }
  }
}, 1000);

/* ══════════════════════════════════════════════════════════════════════════════
   ROUTER + BOOT
   ══════════════════════════════════════════════════════════════════════════════ */

function fixtureBanner() {
  return noticeHtml({
    tone: 'info',
    title: 'Fixture data — nothing here has been on-chain.',
    body:
      'Every vault, price and position below is invented to exercise a state the real protocol can ' +
      'reach: a vault frozen by a stale feed, one whose exits have started queueing, an uncapped ' +
      'sub-vault, a deposit mid-observation-window, and an unattested vault. Append ?api=<url> to ' +
      'read the live metered API instead — it serves less than this needs, and says which fields.',
  });
}

function liveBanner() {
  return noticeHtml({
    tone: 'warn',
    title: `Live API — ${state.apiBase}. Structure only.`,
    body:
      'Vaults, operators and capacity below are read from the on-chain indexer. Everything the ' +
      'protocol keeps off its event log is shown as unknown rather than invented: ' +
      MISSING_IN_LIVE.map(([f]) => f).join('; ') + '. Exit mode in particular cannot be resolved ' +
      'here, and an unresolved exit mode means an exit could be irrevocable.',
  });
}

function render() {
  const h = location.hash || '#/discover';
  const parts = h.slice(2).split('/');
  const view = $('#view');

  if (state.consent) view.innerHTML = renderApiConsent(state.consent);
  else if (parts[0] === 'vault' && parts[1]) view.innerHTML = renderVault(parts[1]);
  else if (parts[0] === 'portfolio') view.innerHTML = renderPortfolio();
  else view.innerHTML = renderDiscover();

  const nav = [['Discover', '#/discover'], ['Portfolio', '#/portfolio']];
  $('#nav').innerHTML = nav.map(([t, u]) =>
    `<button class="navlink" type="button" data-nav="${u}"${h.startsWith(u) ? ' aria-current="page"' : ''}>${t}</button>`).join('');
  for (const b of $('#nav').children) b.addEventListener('click', () => go(b.dataset.nav));

  // Fixture mode has no indexer to be stale against, so it reads as neutral rather than as the
  // critical "age unknown" a live read with no snapshot age would earn.
  const f = state.freshness;
  $('#ageChip').dataset.tone = state.mode === 'fixture' ? 'muted' : f.tone;
  $('#ageChip').title = state.mode === 'fixture'
    ? 'Fixture data. Nothing here is read from a chain or an indexer.'
    : f.note;
  $('#ageText').textContent = state.mode === 'fixture'
    ? 'Fixture data'
    : f.ageSec === null ? 'Data age unknown' : `${f.label} · ${duration(f.ageSec)} old`;

  $('#foot').innerHTML = `Read-only. This interface never connects a wallet, holds a key or signs
    anything — deposits, votes and exits are on-chain transactions you make yourself. Metered reads
    are settled over x402 by the app, never charged to you mid-flow. Protocol mechanics:
    <code>docs/ARCHITECTURE.md</code>. Logic and its tests: <code>apps/web/src/</code>,
    <code>apps/web/test/</code>.`;
}

/** localhost is the dev API this flag exists for; anything else is somebody else's server. */
const isLocalOrigin = (o) => /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/.test(o);

/**
 * `?api=` in a URL is attacker-controllable, and `boot()` does not merely READ the origin it names
 * — it runs the x402 402 → authorize → retry handshake against it, unprompted, on page load. No
 * funds are at risk (the envelope is all zeros and this app holds no key), but it is still an
 * outbound request to a host somebody else chose, whose reply becomes every vault, operator and
 * number on screen. So: say what will happen, and do nothing until the person says yes.
 */
function renderApiConsent(c) {
  return `<p class="lede">This link is asking to read vault data from a server that is not part of this app.</p>
  ${noticeHtml({
    tone: 'critical',
    title: `Nothing has been requested from ${c.origin} yet.`,
    body:
      'If you continue, every vault, operator name, member count and capacity figure on the next ' +
      'screen is authored by whoever runs that host — this app cannot verify any of it against ' +
      'a chain. The read is also metered, so the app will run an x402 payment handshake against ' +
      'the same host. It signs nothing: this interface holds no key and the envelope it sends is ' +
      'all zeros. Nothing about any position you hold on-chain is affected either way.',
  })}
  <div class="panel">
    <div class="row"><div>Origin</div><div class="v">${esc(c.origin)}</div></div>
    <div class="row"><div>Requests it would make<small>Three, on load, and nothing else.</small></div>
      <div class="v" style="font-family:var(--sans)">GET /metrics<br>GET /vaults<br>GET /operators/leaderboard</div></div>
    <div class="row"><div>What it would send<small>No wallet, no key, no signature, no personal data.</small></div>
      <div class="v" style="font-family:var(--sans)">An x402 payment envelope with a zero signature</div></div>
  </div>
  <div class="actionbar">
    <div class="btn-wrap"><button class="btn danger" type="button" data-act="api-allow">Read from ${esc(c.origin)}</button></div>
    <div class="btn-wrap"><button class="btn secondary" type="button" data-act="api-deny">Stay on fixture data</button>
      <span class="btn-reason">Nothing is requested from that host.</span></div>
  </div>`;
}

function bootFixtures() {
  state.mode = 'fixture';
  state.consent = null;
  state.vaults = ready(VAULTS, classify(null));
  state.leaderboard = ready(mapLeaderboard(LEADERBOARD).map((o, i) => ({
    ...o, ...withRaw(LEADERBOARD[i]), name: LEADERBOARD[i].name,
  })), classify(null));
  state.freshness = classify(null);
  state.wallet = WALLET;
  render();
}

async function boot() {
  const apiUrl = new URLSearchParams(location.search).get('api');
  if (!apiUrl) return bootFixtures();

  let origin;
  try {
    origin = new URL(apiUrl, location.href).origin;
  } catch {
    toast(`?api= is not a URL this app can read (${apiUrl}). Showing fixture data instead.`);
    return bootFixtures();
  }
  if (!isLocalOrigin(origin) && !state.apiConfirmed) {
    state.consent = { origin, url: apiUrl };
    render();
    return;
  }
  state.consent = null;

  state.mode = 'live';
  state.wallet = null; // no per-member projection exists, and no wallet is ever connected
  state.vaults = loading();
  state.leaderboard = loading();
  render();

  const base = apiUrl.replace(/\/$/, '');
  state.apiBase = base;
  try {
    const [{ createClient }] = await Promise.all([import('./src/api-client.mjs')]);
    // Against a dev (stub-facilitator) API a dummy envelope is accepted; the browser never holds
    // a real key, and this app never asks the user for one.
    const devSigner = async (ch) => ({
      x402Version: 2, scheme: 'exact', network: ch.network, signature: '0x' + '00'.repeat(65),
      authorization: {
        from: '0x' + '0'.repeat(40), to: ch.payTo, value: ch.amount,
        validAfter: '0', validBefore: String(Math.floor(Date.now() / 1000) + 300), nonce: ch.nonce, asset: ch.asset,
      },
    });
    const client = createClient({ baseUrl: base, signer: devSigner });

    // Freshness comes from the FREE routes, so it is available even if a metered read fails.
    const metricsText = await fetch(`${base}/metrics`).then((r) => r.text()).catch(() => '');
    state.freshness = classify(parseSnapshotAge(metricsText));

    const [vres, lres] = await Promise.all([client.get('/vaults'), client.get('/operators/leaderboard')]);
    const board = lres.data.leaderboard ?? [];
    const records = mapVaultRecords(vres.data.vaults, board);
    state.vaults = records.length ? ready(records, state.freshness) : empty('The indexer has no vaults yet.');
    state.leaderboard = board.length
      ? ready(mapLeaderboard(board).map((o, i) => ({ ...o, ...withRaw(board[i]) })), state.freshness)
      : empty('No operators have realised a gain or loss yet.');
    state.missing = MISSING_IN_LIVE;
  } catch (err) {
    const e = describeError(err);
    state.vaults = e;
    state.leaderboard = e;
    state.freshness = classify(null);
    console.warn('live API read failed', err);
  }
  render();
}

/** Keep the API's exact base units alongside the adapter's lossy display numbers. */
function withRaw(row) {
  return {
    netRaw: toBig(row.netRealizedUsdc) ?? 0n,
    gainRaw: toBig(row.lifetimeGainUsdc) ?? 0n,
    lossRaw: toBig(row.lifetimeLossUsdc) ?? 0n,
    feesRaw: toBig(row.lifetimeFeesUsdc) ?? 0n,
    operatorAddress: row.operator,
    operatorId: row.operatorId,
    vaultCount: row.vaultCount,
  };
}

window.addEventListener('hashchange', () => { closeDialog(); render(); window.scrollTo(0, 0); });
boot();
</script>
